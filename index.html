<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>TagX Costing Calculator</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="root"></div>
<div id="version-badge" style="position:fixed;bottom:4px;right:4px;background:#e74c3c;color:#fff;font:10px monospace;padding:2px 6px;border-radius:3px;z-index:9999;opacity:0.8">v2-center</div>

<script src="lib/react.min.js?v=2"></script>
<script src="lib/react-dom.min.js?v=2"></script>
<script src="lib/babel.min.js?v=2"></script>
<script src="data/papers.js?v=2"></script>
<script src="data/machines.js?v=2"></script>
<script src="data/processes.js?v=2"></script>
<script src="engine/layoutValidation.js?v=2"></script>
<script src="engine/layoutEngine.js?v=2"></script>

<script src="engine/layoutStrategies.js?v=2"></script>
<script src="engine/layoutScore.js?v=2"></script>
<script src="engine/wasteRecovery.js?v=2"></script>
<script src="engine/rulesEngine.js?v=2"></script>

<script src="engine/optimizer.js?v=2"></script>
<script src="engine/layoutOptimizer.js?v=2"></script>

<script src="engine/wasteEngine.js?v=2"></script>
<script src="engine/costingEngine.js?v=2"></script>
<script src="engine/layoutRegressionTests.js?v=2"></script>

<script type="text/babel" data-presets="react">
function lpFmt(v) {
  var n = Number(v);
  if (!Number.isFinite(n)) return "0";
  return n % 1 === 0 ? String(n) : n.toFixed(3);
}

var TAG_STYLE = {
  cutLine: { color: '#000', width: 0.8 },
  bleedLine: { color: '#e74c3c', width: 0.35, dash: '2.5,2', outset: 0.0625 },
  safeLine: { color: '#27ae60', width: 0.25, dash: '1,2.5', inset: 0.125 },
  hole: { radius: 0.125, color: '#000', width: 0.35 },
  centerCross: { size: 0.07, color: '#555', width: 0.2 },
  cornerRadius: 0.0625,
};

function renderTagShape(opts) {
  var els = [];
  var tx = opts.x, ty = opts.y, tw = opts.w, th = opts.h;
  var sc = opts.sc;
  var cx = tx + tw / 2;
  var cy = ty + th / 2;
  var sty = opts.style || TAG_STYLE;
  var L = opts.layers;
  var cr = sty.cornerRadius * sc;

  if (L.bleed) {
    var bw = tw + 2 * sty.bleedLine.outset * sc;
    var bh = th + 2 * sty.bleedLine.outset * sc;
    els.push(
      <rect key="bleed" x={cx - bw/2} y={cy - bh/2} width={bw} height={bh}
        rx={cr + sty.bleedLine.outset * sc}
        fill="none" stroke={sty.bleedLine.color} strokeWidth={sty.bleedLine.width}
        strokeDasharray={sty.bleedLine.dash} />
    );
  }

  if (L.cut) {
    els.push(
      <rect key="cut" x={tx} y={ty} width={tw} height={th}
        rx={cr}
        fill="#fff" stroke={sty.cutLine.color} strokeWidth={sty.cutLine.width} />
    );
  }

  if (L.safe) {
    var sw = tw - 2 * sty.safeLine.inset * sc;
    var sh = th - 2 * sty.safeLine.inset * sc;
    if (sw > 0 && sh > 0) {
      els.push(
        <rect key="safe" x={cx - sw/2} y={cy - sh/2} width={sw} height={sh}
          rx={Math.max(0, cr - sty.safeLine.inset * sc)}
          fill="none" stroke={sty.safeLine.color} strokeWidth={sty.safeLine.width}
          strokeDasharray={sty.safeLine.dash} />
      );
    }
  }

  if (L.hole) {
    var hr = sty.hole.radius * sc;
    els.push(
      <circle key="hole" cx={cx} cy={cy} r={hr}
        fill="#fff" stroke={sty.hole.color} strokeWidth={sty.hole.width} />
    );
  }

  if (L.center) {
    var cs = sty.centerCross.size * sc;
    els.push(
      <line key="hc1" x1={cx - cs} y1={cy} x2={cx + cs} y2={cy}
        stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />,
      <line key="hc2" x1={cx} y1={cy - cs} x2={cx} y2={cy + cs}
        stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />
    );
  }

  if (opts.showId && opts.id) {
    els.push(
      <text key="tid" x={cx} y={ty + sty.safeLine.inset * sc + opts.idFontSize}
        textAnchor="middle" fontSize={opts.idFontSize} fontWeight="600"
        fill="#666" fontFamily="'Courier New',monospace">{opts.id}</text>
    );
  }

  return els;
}

function LayoutPreview(props) {
  var sL = Number(props.sheetLength) || 0;
  var sW = Number(props.sheetWidth) || 0;
  var pL = Number(props.pieceLength) || 0;
  var pW = Number(props.pieceWidth) || 0;
  var tL = Number(props.tagLength) || 0;
  var tW = Number(props.tagWidth) || 0;
  var margin = Number(props.margin) || 0;
  var overlap = Number(props.overlap) || 0;
  var n = Math.max(1, Number(props.piecesAcross) || 1);
  var m = Math.max(1, Number(props.piecesDown) || 1);
  var tR = Math.max(1, Number(props.tagsAcross) || 1);
  var tC = Math.max(1, Number(props.tagsDown) || 1);
  var renderTR = Math.max(1, Number(props.renderTagsAcross) || tR);
  var renderTC = Math.max(1, Number(props.renderTagsDown) || tC);
  var optTagsPerPiece = Number(props.optimizedTagsPerPiece) || tR * tC;
  var rotAdditions = Number(props.rotAdditions) || 0;
  var rotColCount = Number(props.rotColCount) || 0;
  var rotRowCount = Number(props.rotRowCount) || 0;
  var reclaimStrategy = props.reclaimStrategy || 'strip';
  var isHandFeed = props.feedDirection && props.feedDirection.indexOf('Hand') >= 0;
  var isCornerFit = reclaimStrategy === 'corner-fit';
  var totalSheets = props.totalSheets || 0;

  var valid = sL > 0 && sW > 0 && pL > 0 && pW > 0;
  var totalTags = valid ? n * m * optTagsPerPiece : 0;
  var simpleMode = totalTags > 200;
  var wastePct = React.useMemo(function() {
    if (!valid) return 0;
    var tagCutL = tL + 2 * overlap;
    var tagCutW = tW + 2 * overlap;
    var totalTagArea = n * m * optTagsPerPiece * tagCutL * tagCutW;
    var sheetArea = sL * sW;
    if (!sheetArea) return 0;
    return Math.max(0, Math.min(100, (1 - totalTagArea / sheetArea) * 100));
  }, [sL, sW, tL, tW, overlap, n, m, optTagsPerPiece, valid]);

  var rotated = valid && sW > sL;
  var dL = rotated ? sW : sL;
  var dW = rotated ? sL : sW;
  var dN = rotated ? n : m;
  var dM = rotated ? m : n;
  var dPL = rotated ? pW : pL;
  var dPW = rotated ? pL : pW;
  var dTR = rotated ? tC : tR;
  var dTC = rotated ? tR : tC;
  var dTL = rotated === !!props.tagRotated ? tL : tW;
  var dTW = rotated === !!props.tagRotated ? tW : tL;
  var usableDL = Math.max(0, dPL - 2 * margin);
  var usableDW = Math.max(0, dPW - 2 * margin);
  var pitchDL = dTL + 2 * overlap;
  var pitchDW = dTW + 2 * overlap;
  var svgTR = pitchDL > 0 ? Math.floor((usableDL + 2 * overlap) / pitchDL) : 0;
  var svgTC = pitchDW > 0 ? Math.floor((usableDW + 2 * overlap) / pitchDW) : 0;

  var svgDrawnPerPiece = svgTR * svgTC + rotColCount + rotRowCount;
  if (valid && optTagsPerPiece > 0 && svgDrawnPerPiece !== optTagsPerPiece) {
    try { console.warn('LAYOUT MISMATCH: SVG drawn tags/piece (' + svgDrawnPerPiece + ' = main ' + svgTR + 'x' + svgTC + ' + reclaimed ' + rotColCount + '+' + rotRowCount + ') !== reported tags/piece (' + optTagsPerPiece + '). Piece: ' + lpFmt(pL) + 'x' + lpFmt(pW) + ' Tag: ' + lpFmt(tL) + 'x' + lpFmt(tW) + ' Overlap: ' + lpFmt(overlap) + ' Margin: ' + lpFmt(margin)); } catch(e) {}
  }

  var geo = React.useMemo(function() {
    if (!valid) return null;
    var VB_W = 800, PAD_T = 44, PAD_R = 48, PAD_L = 12, PAD_B = 12;
    var cW = VB_W - PAD_L - PAD_R;
    var cH = 480 - PAD_T - PAD_B;
    var sc = Math.min(cW / dL, cH / dW);
    var shW = dL * sc, shH = dW * sc;
    var VB_H = Math.max(260, Math.min(520, PAD_T + shH + PAD_B));
    cH = VB_H - PAD_T - PAD_B;
    sc = Math.min(cW / dL, cH / dW);
    shW = dL * sc; shH = dW * sc;
    var oX = PAD_L + (cW - shW) / 2;
    var oY = PAD_T + (cH - shH) / 2;
    var pw = dPL * sc, ph = dPW * sc;
    var tw = dTL * sc, th = dTW * sc;
    var wasteRight = Math.max(0, dL - dN * dPL) * sc;
    var wasteBottom = Math.max(0, dW - dM * dPW) * sc;
    var fsT = Math.max(11, Math.min(18, sc * 0.9));
    var fsD = Math.max(10, Math.min(15, sc * 0.75));
    var fsL = Math.max(7, Math.min(11, sc * 0.55));
    var fsS = Math.max(6, Math.min(9, sc * 0.4));
    var swT = Math.max(0.4, Math.min(1, sc * 0.04));
    var swM = Math.max(0.8, Math.min(1.8, sc * 0.07));
    var swE = Math.max(1.2, Math.min(2.5, sc * 0.1));
    var dimOff = Math.max(16, Math.min(30, sc * 2.2));
    return {
      VB_W: VB_W, VB_H: VB_H, oX: oX, oY: oY, shW: shW, shH: shH,
      pw: pw, ph: ph, tw: tw, th: th, sc: sc,
      wasteRight: wasteRight, wasteBottom: wasteBottom,
      fsT: fsT, fsD: fsD, fsL: fsL, fsS: fsS,
      swT: swT, swM: swM, swE: swE, dimOff: dimOff
    };
  }, [dL, dW, dPL, dPW, dTL, dTW, dN, dM, valid]);

  if (!valid || !geo) {
    return (
      <div className="lp-shell">
      <div className="lp-title-bar"><span>DIE LAYOUT</span><span className="lp-title-sub">Sheet: {lpFmt(sL)} × {lpFmt(sW)} | Tag: {lpFmt(tL)} × {lpFmt(tW)} | Overlap: {lpFmt(overlap)} | Margin: {lpFmt(margin)} | Scale: Fit to View | {dateStr}</span></div>
        <div className="lp-preview-empty">
          <svg viewBox="0 0 400 250" className="lp-svg"><text x="200" y="130" textAnchor="middle" fontSize="16" fontWeight="600" fill="#aaa" fontFamily="'Courier New',monospace">No valid layout generated</text></svg>
        </div>
      </div>
    );
  }

  var oX = geo.oX, oY = geo.oY, shW = geo.shW, shH = geo.shH;
  var pw = geo.pw, ph = geo.ph, tw = geo.tw, th = geo.th;
  var wasteR = geo.wasteRight, wasteB = geo.wasteBottom;
  var dimY = oY - geo.dimOff;
  var dimX = oX + shW + geo.dimOff;
  var eO = 4;
  var now = new Date();
  var dateStr = now.getDate() + "/" + (now.getMonth() + 1) + "/" + now.getFullYear();

  var L = { cut: true, bleed: true, safe: true, hole: true, center: true };
  var sc = geo.sc;

  return (
    <div className="lp-shell">
      <div className="lp-title-bar"><span>DIE LAYOUT</span><span className="lp-title-sub">Sheet: {lpFmt(sL)} × {lpFmt(sW)} | Tag: {lpFmt(tL)} × {lpFmt(tW)} | Overlap: {lpFmt(overlap)} | Margin: {lpFmt(margin)} | Scale: Fit to View | {dateStr}</span></div>
      <div className="lp-main">
        <div className="lp-drawing-col">
          <div className="lp-drawing">
            <svg viewBox={"0 0 " + geo.VB_W + " " + geo.VB_H} preserveAspectRatio="xMidYMid meet" className="lp-svg" role="img" aria-label="Die layout">

              <defs>
                <pattern id="lp-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <line x1="0" y1="0" x2="0" y2="6" stroke="#c8bba8" strokeWidth="1" />
                </pattern>
              </defs>

              <rect x="0" y="0" width={geo.VB_W} height={geo.VB_H} fill="#f7f6f3" />

              <rect x={oX} y={oY} width={shW} height={shH} fill="#ffffff" stroke="#2a2a2a" strokeWidth={geo.swE} />

              {wasteR > 0.5 && <rect x={oX + shW - wasteR} y={oY} width={wasteR} height={shH} fill="url(#lp-hatch)" stroke="none" />}
              {wasteB > 0.5 && <rect x={oX} y={oY + shH - wasteB} width={shW} height={wasteB} fill="url(#lp-hatch)" stroke="none" />}

              {(() => {
                var pieceGroups = [];
                var reclaimOverlay = [];
                Array.from({ length: dM }).forEach(function(_, row) {
                  Array.from({ length: dN }).forEach(function(_, col) {
                    var px = oX + col * pw;
                    var py = oY + row * ph;
                    var marginSvg = margin * sc;
                    var overlapSvg = overlap * sc;
                    var pitchX = tw + 2 * overlapSvg;
                    var pitchY = th + 2 * overlapSvg;
                    var pIdx = row * dN + col + 1;

                    var usableW = pw - 2 * marginSvg;
                    var usableH = ph - 2 * marginSvg;
                    var gridW = svgTR > 0 ? svgTR * tw + (svgTR - 1) * 2 * overlapSvg : 0;
                    var gridH = svgTC > 0 ? svgTC * th + (svgTC - 1) * 2 * overlapSvg : 0;

                    var hasBtmRm = !simpleMode && rotColCount > 0 && isHandFeed;
                    var btmReclaimH = hasBtmRm ? rotColCount : 0;
                    var hasRgtRm = !simpleMode && (rotRowCount > 0 || isCornerFit) && isHandFeed;
                    var rgtReclaimN = hasRgtRm ? rotRowCount : 0;

                    var isCornerFit = reclaimStrategy === 'corner-fit';
                    var recClaimH = (btmReclaimH > 0) ? th : 0;
                    var recClaimW = (rgtReclaimN > 0) ? th : 0;
                    var recClaimW_corner = isCornerFit ? tw : 0;
                    var contentW = gridW + Math.max(recClaimW, recClaimW_corner);
                    var contentH = gridH + recClaimH;
                    try { console.log("[CENTER] piece " + (row*dN+col+1) + " usable=" + usableW.toFixed(1) + "x" + usableH.toFixed(1) + " grid=" + gridW.toFixed(1) + "x" + gridH.toFixed(1) + " content=" + contentW.toFixed(1) + "x" + contentH.toFixed(1) + " recClaimH=" + recClaimH.toFixed(1) + " recClaimW=" + recClaimW.toFixed(1) + " recClaimW_corner=" + recClaimW_corner.toFixed(1) + " btmReclaimH=" + btmReclaimH + " rgtReclaimN=" + rgtReclaimN); } catch(e) {}
                    try { console.log("===> v2-reclaim-center-active <==="); } catch(e) {}
                    var firstTagX = px + marginSvg + Math.max(0, (usableW - contentW) / 2);
                    var firstTagY = py + marginSvg + Math.max(0, (usableH - contentH) / 2);
                    var lastTagEndX = firstTagX + gridW;
                    var lastTagEndY = firstTagY + gridH;
                    var extPw = pw + (rgtReclaimN > 0 ? th : 0);
                    var extPh = ph + (btmReclaimH > 0 ? th : 0);
                    var leftStrip = Math.max(0, firstTagX - px);
                    var rightStrip = Math.max(0, px + extPw - (firstTagX + contentW));
                    var topStrip = Math.max(0, firstTagY - py);
                    var bottomStrip = Math.max(0, py + extPh - (firstTagY + contentH));
                    try { console.log("[CENTER-OFFSET] piece " + (row*dN+col+1) + " offsetX=" + (firstTagX-px-marginSvg).toFixed(2) + " offsetY=" + (firstTagY-py-marginSvg).toFixed(2) + " usableW-contentW=" + (usableW-contentW).toFixed(2) + " usableH-contentH=" + (usableH-contentH).toFixed(2) + " topStrip=" + topStrip.toFixed(2) + " bottomStrip=" + bottomStrip.toFixed(2) + " leftStrip=" + leftStrip.toFixed(2) + " rightStrip=" + rightStrip.toFixed(2) + " extPw=" + extPw.toFixed(1) + " extPh=" + extPh.toFixed(1)); } catch(e) {}

                    var totalTagsPerPiece = svgTR * svgTC + btmReclaimH + rgtReclaimN;
                    var pieceIdx = row * dN + col;
                    try { console.log("[RECLAIM-DIAG] piece " + (pieceIdx+1) + " (row=" + row + " col=" + col + ") btmReclaimH=" + btmReclaimH + " rgtReclaimN=" + rgtReclaimN + " contentW=" + contentW.toFixed(1) + " contentH=" + contentH.toFixed(1) + " firstTagX=" + firstTagX.toFixed(1) + " firstTagY=" + firstTagY.toFixed(1) + " rcx(rgt)=" + (lastTagEndX).toFixed(1) + " rcy(rgt)=" + firstTagY.toFixed(1) + " rcx(btm)=" + firstTagX.toFixed(1) + " rcy(btm)=" + (lastTagEndY).toFixed(1) + " tw=" + tw.toFixed(1) + " th=" + th.toFixed(1)); } catch(e) {}

                    pieceGroups.push(
                      <g key={"p" + row + "-" + col}>
                        <rect x={px} y={py} width={extPw} height={extPh} fill="none" stroke="#999" strokeWidth={geo.swT} />
                        {!simpleMode && <>
                        {rightStrip > 0.5 && !hasRgtRm && <rect x={lastTagEndX} y={firstTagY} width={rightStrip} height={gridH} fill="url(#lp-hatch)" stroke="none" />}
                        {leftStrip > 0.5 && <rect x={px} y={firstTagY} width={leftStrip} height={gridH} fill="url(#lp-hatch)" stroke="none" />}
                        {bottomStrip > 0.5 && !hasBtmRm && <rect x={firstTagX} y={lastTagEndY} width={gridW} height={bottomStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {topStrip > 0.5 && <rect x={firstTagX} y={py} width={gridW} height={topStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {leftStrip > 0.5 && topStrip > 0.5 && <rect x={px} y={py} width={leftStrip} height={topStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {rightStrip > 0.5 && topStrip > 0.5 && <rect x={lastTagEndX} y={py} width={rightStrip} height={topStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {leftStrip > 0.5 && bottomStrip > 0.5 && !hasBtmRm && <rect x={px} y={lastTagEndY} width={leftStrip} height={bottomStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {rightStrip > 0.5 && bottomStrip > 0.5 && !hasBtmRm && <rect x={lastTagEndX} y={lastTagEndY} width={rightStrip} height={bottomStrip} fill="url(#lp-hatch)" stroke="none" />}
                        </>}
                        {simpleMode ? (
                          <g>
                            {svgTC * svgTR + btmReclaimH + rgtReclaimN > 1 && <text x={px + pw / 2} y={py + ph / 2} textAnchor="middle" dominantBaseline="central" fontSize={Math.max(6, Math.min(10, sc * 0.5))} fill="#888" fontFamily="'Courier New',monospace">{svgTC * svgTR + btmReclaimH + rgtReclaimN} tags</text>}
                          </g>
                        ) : (
                        <g>
                          {Array.from({ length: svgTC }).map(function(_, tr) {
                            return Array.from({ length: svgTR }).map(function(_, tc) {
                              var tx = firstTagX + tc * pitchX;
                              var ty = firstTagY + tr * pitchY;
                              var tagNum = pieceIdx * totalTagsPerPiece + tr * svgTR + tc + 1;
                              var tagId = "T" + String(tagNum);
                              var showId = tw > 14 && th > 10;
                              var idFontSize = Math.max(5, Math.min(8, sc * 0.45));
                              return (
                                <g key={"t" + row + "-" + col + "-" + tr + "-" + tc}>
                                  {renderTagShape({
                                    x: tx, y: ty, w: tw, h: th, sc: sc,
                                    style: TAG_STYLE, layers: L,
                                    id: tagId, showId: showId, idFontSize: idFontSize,
                                  })}
                                </g>
                              );
                            });
                          })}
                        </g>
                        )}
                      </g>
                    );
                    if (!simpleMode) {
                      if (btmReclaimH > 0) {
                        Array.from({ length: btmReclaimH }).forEach(function(_, i) {
                          var isCornerFit = reclaimStrategy === 'corner-fit';
                          var rcx = isCornerFit ? lastTagEndX : firstTagX + i * (tw + 2 * overlapSvg);
                          var rcy = isCornerFit ? lastTagEndY : lastTagEndY;
                          var tagNum = pieceIdx * totalTagsPerPiece + svgTR * svgTC + i + 1;
                          var tagId = "T" + String(tagNum);
                          var showId = tw > 14 && th > 10;
                          var idFontSize = Math.max(5, Math.min(8, sc * 0.45));
                          try { console.log("[RECLAIM-DIAG] piece " + (pieceIdx+1) + " BTM-reclaim RENDERS tag=" + tagId + " at (" + rcx.toFixed(1) + "," + rcy.toFixed(1) + ") w=" + tw.toFixed(1) + " h=" + th.toFixed(1)); } catch(e) {}
                          reclaimOverlay.push(
                            <g key={"rb-" + row + "-" + col + "-" + i}>
                              {renderTagShape({
                                x: rcx, y: rcy, w: tw, h: th, sc: sc,
                                style: TAG_STYLE, layers: L,
                                id: tagId, showId: showId, idFontSize: idFontSize,
                              })}
                              <rect x={rcx} y={rcy} width={tw} height={th} fill="rgba(255,0,0,0.3)" stroke="red" strokeWidth="3" />
                            </g>
                          );
                        });
                      }
                      if (rgtReclaimN > 0) {
                        Array.from({ length: rgtReclaimN }).forEach(function(_, i) {
                          var rcx = lastTagEndX;
                          var rcy = firstTagY + i * (tw + 2 * overlapSvg);
                          var tagNum = pieceIdx * totalTagsPerPiece + svgTR * svgTC + btmReclaimH + i + 1;
                          var tagId = "T" + String(tagNum);
                          var showId = th > 14 && tw > 10;
                          var idFontSize = Math.max(5, Math.min(8, sc * 0.45));
                          try { console.log("[RECLAIM-DIAG] piece " + (pieceIdx+1) + " RGT-reclaim RENDERS tag=" + tagId + " at (" + rcx.toFixed(1) + "," + rcy.toFixed(1) + ") w=" + th.toFixed(1) + " h=" + tw.toFixed(1)); } catch(e) {}
                          reclaimOverlay.push(
                            <g key={"rr-" + row + "-" + col + "-" + i}>
                              {renderTagShape({
                                x: rcx, y: rcy, w: th, h: tw, sc: sc,
                                style: TAG_STYLE, layers: L,
                                id: tagId, showId: showId, idFontSize: idFontSize,
                              })}
                              <rect x={rcx} y={rcy} width={th} height={tw} fill="rgba(255,0,0,0.3)" stroke="red" strokeWidth="3" />
                            </g>
                          );
                        });
                      }
                    }
                  });
                });
                return [pieceGroups, <g key={"reclaim-overlay"}>{reclaimOverlay}</g>];
              })()}

              <g>
                <line x1={oX} y1={oY - 3} x2={oX} y2={dimY - eO} stroke="#444" strokeWidth={geo.swT} />
                <line x1={oX + shW} y1={oY - 3} x2={oX + shW} y2={dimY - eO} stroke="#444" strokeWidth={geo.swT} />
                <line x1={oX - 2} y1={dimY} x2={oX + shW + 2} y2={dimY} stroke="#444" strokeWidth={geo.swT} />

function jsonpRequest(params) {
  return new Promise(function(resolve, reject) {
    if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0) {
      reject(new Error("API_URL not configured yet"));
      return;
    }
    var cbName = "tcCb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    var script = null;
    var timeout = null;
    function cleanup() {
      delete window[cbName];
      if (script && script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeout);
    }
    timeout = setTimeout(function() { cleanup(); reject(new Error("Request timed out")); }, 15000);
    window[cbName] = function(data) { cleanup(); resolve(data); };
    var query = new URLSearchParams(Object.assign({}, params, { callback: cbName })).toString();
    script = document.createElement("script");
    script.src = API_URL + "?" + query;
    script.onerror = function() { cleanup(); reject(new Error("Network error reaching API")); };
    document.body.appendChild(script);
  });
}

var __tcCache = null;
var __tcCacheAt = 0;
async function fetchAllCached() {
  var now = Date.now();

  var result = await jsonpRequest({ action: "getAll" });
  if (!result.ok) throw new Error(result.error || "Failed to load data");
  __tcCache = result;
  __tcCacheAt = now;
  return result;
}

  get: async function(key) {

    if (!field) return null;
    return { key: key, value: JSON.stringify(result[field]), shared: true };

                {showAdvancedLayout && (<div className="tc-override-box">
                  <div className="tc-field-hint" style={{ marginBottom: 10 }}>Max feed size - the largest piece each machine can take. Pieces are grouped as large as possible within this limit.</div>
                  <div className="tc-row"><Field label="Offset max feed"><NumberInput value={feedOffsetL} onChange={setFeedOffsetL} suffix="in" /></Field><Field label="x "><NumberInput value={feedOffsetW} onChange={setFeedOffsetW} suffix="in" /></Field></div>
                  <div className="tc-row"><Field label="Hand print max feed"><NumberInput value={feedHandL} onChange={setFeedHandL} suffix="in" /></Field><Field label="x "><NumberInput value={feedHandW} onChange={setFeedHandW} suffix="in" /></Field></div>
                  <div className="tc-field-hint">Minimum piece size for hand print: 6" x 9".</div>
                  <Toggle checked={overridePieces} onChange={setOverridePieces} onLabel="Overriding pieces per sheet" offLabel="Using app's suggested grouping" />
                  {overridePieces && <Field label="Pieces per sheet (manual)"><NumberInput value={manualPiecesPerSheet} onChange={setManualPiecesPerSheet} min={0} step={1} /></Field>}
                </div>)}
              </>)}
              <div className="tc-section-title"><Printer /> Printing</div>
              <div className="tc-choice-row">
                <div className={"tc-choice" + (printMethod === "offset" ? " tc-choice-active" : "")} onClick={function() { setPrintMethod("offset"); }}>Offset</div>
                <div className={"tc-choice" + (printMethod === "hand" ? " tc-choice-active" : "")} onClick={function() { setPrintMethod("hand"); }}>Hand print</div>
              </div>
              {printMethod === "hand" && <Field label="Number of colors" hint="Rs500 per color per 1000 pulls"><NumberInput value={colors} onChange={setColors} min={1} step={1} /></Field>}
              <div className="tc-section-title"><CircleDot /> Lamination & finishing</div>
              <Toggle checked={lamination} onChange={setLamination} onLabel="Matt lamination - yes" offLabel="No lamination" />
              <div className="tc-field-hint" style={{ marginBottom: 10 }}>Die punching is applied to every job automatically.</div>
              <div className="tc-section-title"><Truck /> Order</div>
              <div className="tc-row">
                <Field label="Order quantity"><NumberInput value={orderQty} onChange={setOrderQty} min={1} step={1} suffix="tags" /></Field>
                {isOwner ? <Field label="Transport (flat)"><NumberInput value={transport} onChange={setTransport} suffix="Rs/order" /></Field> : <div />}
              </div>
              {isOwner ? (<>
                <div className="tc-section-title"><Percent /> Your reference margin</div>
                <div className="tc-margin-row" style={{ marginTop: 0 }}>
                  <div style={{ width: 110 }}><NumberInput value={marginPct} onChange={setMarginPct} min={0} suffix="%" /></div>
                  <div className="tc-choice-row" style={{ marginBottom: 0, flex: 1 }}>
                    <div className={"tc-choice" + (marginMode === "markup" ? " tc-choice-active" : "")} onClick={function() { setMarginMode("markup"); }}>On cost (markup)</div>
                    <div className={"tc-choice" + (marginMode === "margin" ? " tc-choice-active" : "")} onClick={function() { setMarginMode("margin"); }}>On price (margin)</div>
                  </div>
                </div>
              </>) : (<>
                <div className="tc-section-title"><Users /> Welcome, {session.name}</div>
                <div className="tc-agent-empty" style={{ marginBottom: 12 }}>Your margin has been applied automatically. Enter the job details on the left to generate a quote.</div>
              </>)}
            </>) : null}
          </div>
          {isOwner ? (ownerView === "calculator" ? (
            <div className="tc-tag">
              <div className="tc-tag-hole-loop" />
              <div className="tc-tag-header"><div className="tc-tag-eyebrow">Cost Breakdown</div><div className="tc-tag-qty">{num(orderQty, 0)} tags ordered - {num(calc.sheetsNeeded, 0)} sheets - {num(calc.totalPieces, 0)} pieces - {num(calc.totalTags, 0)} tags produced</div></div>
              <div className="tc-lines">
                <LineItem icon={<Layers />} label="Material" sub={num(calc.sheetsNeeded, 0) + " sheets x " + inr(sheetRate)} amount={inr(calc.materialCost)} />
                <LineItem icon={<Printer />} label={printMethod === "offset" ? "Offset printing" : "Hand printing"} sub={printMethod === "offset" ? "Min Rs2,000 (1000 pcs) + " + Math.max(0, calc.printSlabs - 1) + " x Rs350" : colors + " color(s) x Rs500 x " + calc.printSlabs + " slab(s)"} amount={inr(calc.printingCost)} />
                <LineItem icon={<CircleDot />} label="Lamination (matt)" sub={lamination ? num(calc.pieceAreaSqIn) + " sq.in x " + num(calc.totalPieces, 0) + " pieces x Rs0.004" : "Not applied"} amount={inr(calc.laminationCost)} muted={!lamination} />
                <LineItem icon={<Scissors />} label="Die punching" sub={"Die (" + calc.tier.label + "): " + inr(calc.dieMakingCost) + " + running " + calc.dieSlabs + " slab(s) x Rs" + calc.tier.runRate} amount={inr(calc.dieTotalCost)} />
                <LineItem icon={<Truck />} label="Transportation" sub="Flat, per order" amount={inr(calc.transportCost)} />
              </div>
              <div className="tc-subtotal-row"><span>Subtotal (cost)</span><strong>{inr(calc.subtotal)}</strong></div>
              <div className="tc-subtotal-row"><span>Profit ({marginPct}% {marginMode === "markup" ? "on cost" : "on price"})</span><strong>{inr(calc.profitAmount)}</strong></div>
              <div className="tc-final"><div className="tc-final-label">Selling Price - This Order</div><div className="tc-final-price">{inr(calc.sellingPrice)}</div><div className="tc-final-per">{inr(calc.pricePerTag)} per tag - cost {inr(calc.costPerTag)} per tag</div></div>
              {calc.overage > 0 && <div className="tc-overage-note">Sheets round up to whole numbers - this run produces {num(calc.totalTags, 0)} tags, {num(calc.overage, 0)} more than ordered, at no extra charge.</div>}
              <button className={"tc-assump-toggle" + (showAssumptions ? " open" : "")} onClick={function() { setShowAssumptions(function(s) { return !s; }); }}><ChevronDown /> {showAssumptions ? "Hide" : "Show"} assumptions used in this calculation</button>
              {showAssumptions && (<ul className="tc-assumptions">
                <li>The full sheet is cut into {num(calc.n,0)} x {num(calc.m,0)} = {num(calc.autoPiecesPerSheet,0)} equal pieces ({num(calc.pieceL)}" x {num(calc.pieceW)}" each) sized to fit the {printMethod} machine's max feed.</li>
                <li>Each piece is then packed with tags (each needing {num(cuttingOverlapMM,1)}mm cutting overlap per side): {num(calc.tagsRows,0)} x {num(calc.tagsCols,0)} = {num(calc.tagsPerPieceNominal,0)} tags/piece, {num(calc.totalTagsPerSheet,0)} tags/sheet total.</li>
                <li>The leftover space becomes the inlap/margin around the tags - at least the minimum {num(insideMarginMM,1)}mm/side you set.</li>
                <li>Printing, lamination and die-punching costs are counted per piece, not per tag or per sheet.</li>
                <li>Slab rounding: up to 200 pieces over a 1,000 mark still count as that slab; 201+ rolls to the next.</li>
                <li>Lamination area is based on the piece size, at Rs0.004/sq.in, matt only.</li>
                <li>Die tier and running rate: up to 10x10" (Rs1,000 die), up to 14x20" (Rs1,800 die), both Rs500/1000 running; bigger is Rs2,800 die at Rs750/1000 running.</li>
                <li>Labor is Rs0 - treated as already built into the rates above.</li>
                <li>Transport is a flat Rs{num(transport, 0)} per order, not per piece.</li>
                <li>Agent margins are stored per user and applied automatically - agents never see the cost breakdown or the %.</li>
              </ul>)}
            </div>
          ) : null) : (
            <div className="tc-tag">
              <div className="tc-tag-hole-loop" />
              <div className="tc-tag-header"><div className="tc-tag-eyebrow">Quote</div><div className="tc-tag-qty">{num(orderQty, 0)} tags</div></div>
              <div className="tc-final" style={{ marginTop: 6 }}><div className="tc-final-label">Price for this order</div><div className="tc-final-price">{inr(calc.sellingPrice)}</div><div className="tc-final-per">{inr(calc.pricePerTag)} per tag</div></div>
            </div>
          )}
        </div>
        {isOwner && ownerView === "calculator" && (
          <div style={{ maxWidth: 1180, margin: "18px auto 0" }}>
            <button className={"tc-assump-toggle" + (showLayoutPreview ? " open" : "")} onClick={function() { setShowLayoutPreview(function(s) { return !s; }); }}><ChevronDown /> {showLayoutPreview ? "Hide" : "Show"} visual layout preview</button>
            {showLayoutPreview && <div style={{ marginTop: 12 }}>
              {layoutCandidates && layoutCandidates.length > 1 && (
                <div className="lo-alt-bar">
                  {layoutCandidates.slice(0, 6).map(function(c, i) {
                    return (
                      <button key={i} className={"lo-alt-btn" + (safeAltIdx === i ? " lo-alt-active" : "") + (i === 0 ? " lo-alt-best" : "")}
                        onClick={function() { setAltIdx(i); }}>
                        <span className="lo-alt-label">{i === 0 ? "BEST" : "Alt " + i}</span>
                        <span className="lo-alt-stat">{num(c.totalTagsPerSheet, 0)} <small>tags/sht</small></span>
                        <span className="lo-alt-stat">{c.wastePct.toFixed(1)}% <small>waste</small></span>
                        <span className="lo-alt-stat">{c.utilization.toFixed(1)}% <small>util</small></span>
                        <span className="lo-alt-stat">{lpFmt(c.pieceL)}×{lpFmt(c.pieceW)} <small>piece</small></span>
                        <span className="lo-alt-reason">{c.reasons.join(', ')}</span>
                      </button>
                    );
                  })}
                </div>
              )}
              {Array.isArray(layoutCandidates) && layoutCandidates.length === 0 ? (
                <div className="lo-no-layout">No manufacturable layout found for current machine.</div>
              ) : (
              <div style={{ marginTop: layoutCandidates && layoutCandidates.length > 1 ? 12 : 0 }}>
                <MemoLayoutPreview title="Layout Preview"
                  sheetLength={sheetL} sheetWidth={sheetW}
                  pieceLength={selectedC ? selectedC.pieceL : calc.pieceL}
                  pieceWidth={selectedC ? selectedC.pieceW : calc.pieceW}
                  piecesAcross={selectedC ? selectedC.n : calc.n}
                  piecesDown={selectedC ? selectedC.m : calc.m}
                  tagLength={selectedC ? selectedC.TL : calc.TL}
                  tagWidth={selectedC ? selectedC.TW : calc.TW}
                  tagsAcross={selectedC ? selectedC.tagsRows : calc.tagsRows}
                  tagsDown={selectedC ? selectedC.tagsCols : calc.tagsCols}
                  renderTagsAcross={selectedC && selectedC.optimization ? selectedC.optimization.renderCols : calc.tagsCols}
                  renderTagsDown={selectedC && selectedC.optimization ? selectedC.optimization.renderRows : calc.tagsRows}
                  optimizedTagsPerPiece={selectedC && selectedC.optimization ? selectedC.optimization.finalTags : calc.tagsRows * calc.tagsCols}
                  rotAdditions={selectedC && selectedC.optimization ? selectedC.optimization.rotAdditions : 0}
                  rotColCount={selectedC && selectedC.optimization ? selectedC.optimization.rotColCount : 0}
                  rotRowCount={selectedC && selectedC.optimization ? selectedC.optimization.rotRowCount : 0}
                  reclaimStrategy={selectedC && selectedC.optimization ? selectedC.optimization.reclaimStrategy : 'strip'}
                  overlap={calc.overlapIn} margin={calc.marginIn}
                  tagRotated={selectedC && selectedC.optimization ? selectedC.optimization.isTagRotated : false}
                  orientation={calc.isRotated ? "Tag rotated 90deg" : "Tag as entered"}
                  totalSheets={calc.sheetsNeeded} quantity={orderQty}
                  feedDirection={printMethod === "offset" ? "Offset press feed" : "Hand-print feed"} />
              </div>
              )}
            </div>}
          </div>
        )}
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TagCostingCalculator />);
</script>
</body>
</html>
