<!DOCTYPE html>

<body>

<div id="version-badge" style="position:fixed;bottom:4px;right:4px;background:#e74c3c;color:#fff;font:10px monospace;padding:2px 6px;border-radius:3px;z-index:9999;opacity:0.8">v2.3.1</div>

<script src="lib/react.min.js?v=2.3.1"></script>

<script type="text/babel" data-presets="react">
function lpFmt(v) {
  var n = Number(v);
  if (!Number.isFinite(n)) return "0";
  return n % 1 === 0 ? String(n) : n.toFixed(3);
}

var TAG_STYLE = {
  cutLine: { color: '#c0392b', width: 0.8 },
  bleedLine: { color: '#e74c3c', width: 0.35, dash: '2.5,2', outset: 0.0625 },
  safeLine: { color: '#27ae60', width: 0.25, dash: '1,2.5', inset: 0.125 },
  hole: { radius: 0.125, color: '#c0392b', width: 0.35 },
  centerCross: { size: 0.07, color: '#555', width: 0.2 },
  cornerRadius: 0.0625,
};

function renderTagShape(opts) {
  var els = [];
  var tx = opts.x, ty = opts.y, tw = opts.w, th = opts.h;
  var sc = opts.sc;
  var cx = tx + tw / 2;
  var cy = ty + th / 2;
  var sty = opts.style || TAG_STYLE;
  var L = opts.layers;
  var cr = sty.cornerRadius * sc;

  if (L.bleed && !opts.sharedCut) {
    var bw = tw + 2 * sty.bleedLine.outset * sc;
    var bh = th + 2 * sty.bleedLine.outset * sc;
    els.push(
      <rect key="bleed" x={cx - bw/2} y={cy - bh/2} width={bw} height={bh}
        rx={cr + sty.bleedLine.outset * sc}
        fill="none" stroke={sty.bleedLine.color} strokeWidth={sty.bleedLine.width}
        strokeDasharray={sty.bleedLine.dash} />
    );
  }

  if (L.cut) {
    els.push(
      <rect key="cut" x={tx} y={ty} width={tw} height={th}
        rx={cr}
        fill={(opts.tagColor && opts.tagColor.fill) || "#fff"}
        stroke={(opts.tagColor && opts.tagColor.cut) || sty.cutLine.color}
        strokeWidth={sty.cutLine.width} />
    );
  }

  if (opts.crease) {
    var creaseCol = "#4a148c";
    if (tw >= th) {
      els.push(
        <line key="crease-line" x1={cx} y1={ty} x2={cx} y2={ty + th} stroke={creaseCol} strokeWidth="1.2" strokeDasharray="none" />
      );
      if (th > 20) {
        var fsCrease = Math.max(5, Math.min(7, sc * 0.45));
        els.push(
          <text key="crease-txt" x={cx - 3} y={cy} textAnchor="middle" dominantBaseline="central"
            fontSize={fsCrease} fontWeight="700" letterSpacing="1"
            fill={creaseCol} fontFamily="'Courier New',monospace"
            transform={"rotate(-90 " + (cx - 3) + " " + cy + ")"}>CREASING</text>
        );
      }
    } else {
      els.push(
        <line key="crease-line" x1={tx} y1={cy} x2={tx + tw} y2={cy} stroke={creaseCol} strokeWidth="1.2" strokeDasharray="none" />
      );
      if (tw > 20) {
        var fsCrease2 = Math.max(5, Math.min(7, sc * 0.45));
        els.push(
          <text key="crease-txt" x={cx} y={cy - 3} textAnchor="middle" dominantBaseline="central"
            fontSize={fsCrease2} fontWeight="700" letterSpacing="1"
            fill={creaseCol} fontFamily="'Courier New',monospace">CREASING</text>
        );
      }
    }
  }

  if (L.safe) {
    var sw = tw - 2 * sty.safeLine.inset * sc;
    var sh = th - 2 * sty.safeLine.inset * sc;
    if (sw > 0 && sh > 0) {
      els.push(
        <rect key="safe" x={cx - sw/2} y={cy - sh/2} width={sw} height={sh}
          rx={Math.max(0, cr - sty.safeLine.inset * sc)}
          fill="none" stroke={sty.safeLine.color} strokeWidth={sty.safeLine.width}
          strokeDasharray={sty.safeLine.dash} />
      );
    }
  }

  if (L.hole) {
    var hr = sty.hole.radius * sc;
    if (opts.crease) {
      if (tw >= th) {
        var offX = tw * 0.25;
        els.push(
          <circle key="hole-l" cx={cx - offX} cy={cy} r={hr} fill="#fff" stroke={sty.hole.color} strokeWidth={sty.hole.width} />,
          <circle key="hole-r" cx={cx + offX} cy={cy} r={hr} fill="#fff" stroke={sty.hole.color} strokeWidth={sty.hole.width} />
        );
      } else {
        var offY = th * 0.25;
        els.push(
          <circle key="hole-t" cx={cx} cy={cy - offY} r={hr} fill="#fff" stroke={sty.hole.color} strokeWidth={sty.hole.width} />,
          <circle key="hole-b" cx={cx} cy={cy + offY} r={hr} fill="#fff" stroke={sty.hole.color} strokeWidth={sty.hole.width} />
        );
      }
    } else {
      var holeMargin = Math.max(hr + 2, Math.min(tw, th) * 0.18);
      var hx = cx, hy = cy;
      if (tw <= th) {
        hx = cx;
        hy = ty + holeMargin;
      } else {
        hx = tx + holeMargin;
        hy = cy;
      }
      els.push(
        <circle key="hole" cx={hx} cy={hy} r={hr} fill="#fff" stroke={sty.hole.color} strokeWidth={sty.hole.width} />
      );
    }
  }

  if (L.center && !opts.crease) {
    var cs = sty.centerCross.size * sc;
    // If tag ID is shown at center, keep a small gap so text is crisp and clean
    var idGap = (opts.showId && opts.id) ? (opts.idFontSize * 1.4) : 0;
    if (idGap > 0) {
      if (cs > idGap) {
        els.push(
          <line key="hc1-l" x1={cx - cs} y1={cy} x2={cx - idGap} y2={cy} stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />,
          <line key="hc1-r" x1={cx + idGap} y1={cy} x2={cx + cs} y2={cy} stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />,
          <line key="hc2-t" x1={cx} y1={cy - cs} x2={cx} y2={cy - opts.idFontSize * 0.8} stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />,
          <line key="hc2-b" x1={cx} y1={cy + opts.idFontSize * 0.8} x2={cx} y2={cy + cs} stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />
        );
      }
    } else {
      els.push(
        <line key="hc1" x1={cx - cs} y1={cy} x2={cx + cs} y2={cy}
          stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />,
        <line key="hc2" x1={cx} y1={cy - cs} x2={cx} y2={cy + cs}
          stroke={sty.centerCross.color} strokeWidth={sty.centerCross.width} />
      );
    }
  }

  if (opts.showId && opts.id) {
    var idX = cx;
    var idY = cy;
    if (opts.crease) {
      if (tw >= th) {
        // Horizontal unfolded tag (vertical center crease rule):
        // Shift label to the upper quadrant of the right flap, clear of both crease line and punch holes
        idX = cx + tw * 0.25;
        idY = cy - th * 0.25;
      } else {
        // Vertical unfolded tag (horizontal center crease rule):
        idX = cx + tw * 0.25;
        idY = cy + th * 0.25;
      }
    }
    els.push(
      <text key="tid" x={idX} y={idY}
        textAnchor="middle" dominantBaseline="central"
        fontSize={opts.idFontSize} fontWeight="600"
        fill={(opts.tagColor && opts.tagColor.text) || "#555"} fontFamily="'Courier New',monospace">{opts.id}</text>
    );
  }

  return els;
}

function LayoutPreview(props) {
  var viewMode_state = React.useState(props.viewMode || "sheet");
  var viewMode = (props.viewMode !== undefined) ? props.viewMode : viewMode_state[0];
  var setViewMode = props.onViewModeChange || viewMode_state[1];
  var sL = Number(props.sheetLength) || 0;
  var sW = Number(props.sheetWidth) || 0;
  var pL = Number(props.pieceLength) || 0;
  var pW = Number(props.pieceWidth) || 0;
  var tL = Number(props.tagLength) || 0;
  var tW = Number(props.tagWidth) || 0;
  var margin = Number(props.margin) || 0;
  var overlap = Number(props.overlap) || 0;
  var n = Math.max(1, Number(props.piecesAcross) || 1);
  var m = Math.max(1, Number(props.piecesDown) || 1);
  var tR = Math.max(1, Number(props.tagsAcross) || 1);
  var tC = Math.max(1, Number(props.tagsDown) || 1);
  var renderTR = Math.max(1, Number(props.renderTagsAcross) || tR);
  var renderTC = Math.max(1, Number(props.renderTagsDown) || tC);
  var optTagsPerPiece = Number(props.optimizedTagsPerPiece) || tR * tC;
  var rotAdditions = Number(props.rotAdditions) || 0;
  var rotColCount = Number(props.rotColCount) || 0;
  var rotRowCount = Number(props.rotRowCount) || 0;
  var reclaimStrategy = props.reclaimStrategy || 'strip';
  var cornerCount    = Number(props.cornerCount) || 0;
  var cornerTagL     = Number(props.cornerTagL) || 0;
  var cornerTagW     = Number(props.cornerTagW) || 0;
  var isHandFeed = props.feedDirection && (props.feedDirection.indexOf('Hand') >= 0 || props.feedDirection.indexOf('Screen') >= 0);
  var isCornerFitCandidate = reclaimStrategy === 'corner-fit' && cornerCount > 0;
  var totalSheets = props.totalSheets || 0;

  var candBlocks = (props.selectedC && Array.isArray(props.selectedC.blocks) && props.selectedC.blocks.length > 0) ? props.selectedC.blocks : null;

  var [zoom, setZoom] = React.useState(1);
  var [isDragging, setIsDragging] = React.useState(false);
  var drawingRef = React.useRef(null);
  var panStartRef = React.useRef({ x: 0, y: 0, scrollLeft: 0, scrollTop: 0 });

  var handleZoomIn = React.useCallback(function() {
    setZoom(function(z) { return Math.min(3, +(z + 0.25).toFixed(2)); });
  }, []);

  var handleZoomOut = React.useCallback(function() {
    setZoom(function(z) { return Math.max(0.5, +(z - 0.25).toFixed(2)); });
  }, []);

  var handleZoomReset = React.useCallback(function() {
    setZoom(1);
    if (drawingRef.current) {
      drawingRef.current.scrollLeft = 0;
      drawingRef.current.scrollTop = 0;
    }
  }, []);

  var handleWheel = React.useCallback(function(e) {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      if (e.deltaY < 0) {
        setZoom(function(z) { return Math.min(3, +(z + 0.15).toFixed(2)); });
      } else {
        setZoom(function(z) { return Math.max(0.5, +(z - 0.15).toFixed(2)); });
      }
    }
  }, []);

  var handleMouseDown = React.useCallback(function(e) {
    if (zoom <= 1) return;
    if (e.target && e.target.closest && e.target.closest('button')) return;
    setIsDragging(true);
    panStartRef.current = {
      x: e.clientX,
      y: e.clientY,
      scrollLeft: drawingRef.current ? drawingRef.current.scrollLeft : 0,
      scrollTop: drawingRef.current ? drawingRef.current.scrollTop : 0
    };
  }, [zoom]);

  var handleMouseMove = React.useCallback(function(e) {
    if (!isDragging || !drawingRef.current) return;
    var dx = e.clientX - panStartRef.current.x;
    var dy = e.clientY - panStartRef.current.y;
    drawingRef.current.scrollLeft = panStartRef.current.scrollLeft - dx;
    drawingRef.current.scrollTop = panStartRef.current.scrollTop - dy;
  }, [isDragging]);

  var handleMouseUp = React.useCallback(function() {
    setIsDragging(false);
  }, []);

  function getTagUps(t, ti) {
    if (candBlocks && candBlocks.length > 0) {
      var tagBlocks = candBlocks.filter(function(b) {
        return b.tagIndex === ti || (b.tagName && t.name && b.tagName.toLowerCase() === t.name.toLowerCase());
      });
      if (tagBlocks.length > 0) {
        return tagBlocks.reduce(function(sum, b) { return sum + (b.count || b.slots || 0); }, 0);
      }
    }
    if (props.selectedC && props.selectedC.itemizedTags) {
      var it = props.selectedC.itemizedTags.find(function(item) {
        return item.id === t.id || item.name === t.name || item.tagIndex === ti;
      });
      if (it && it.slots) return it.slots;
    }
    if (props.selectedC && props.selectedC.slotsByTag && props.selectedC.slotsByTag[ti] != null) {
      return props.selectedC.slotsByTag[ti];
    }
    if (props.selectedC && props.selectedC.tagsList && props.selectedC.tagsList[ti]) {
      return props.selectedC.tagsList[ti].baseSlots || props.selectedC.tagsList[ti].ratioUp || 1;
    }
    return t.slots || t.ratioUp || 1;
  }

  var valid = sL > 0 && sW > 0 && pL > 0 && pW > 0;
  var totalTags = valid
    ? (props.selectedC && props.selectedC.totalTagsPerSheet ? props.selectedC.totalTagsPerSheet : n * m * optTagsPerPiece)
    : 0;
  var simpleMode = totalTags > 200;
  var wastePct = React.useMemo(function() {
    if (!valid) return 0;
    if (props.selectedC && typeof props.selectedC.wastePct === 'number' && !isNaN(props.selectedC.wastePct)) {
      return props.selectedC.wastePct;
    }
    var tagCutL = tL + 2 * overlap;
    var tagCutW = tW + 2 * overlap;
    var totalTagArea = n * m * optTagsPerPiece * tagCutL * tagCutW;
    var sheetArea = sL * sW;
    if (!sheetArea) return 0;
    return Math.max(0, Math.min(100, (1 - totalTagArea / sheetArea) * 100));
  }, [sL, sW, tL, tW, overlap, n, m, optTagsPerPiece, valid, props.selectedC]);

  var rotated = valid && sW > sL;
  var dL = rotated ? sW : sL;
  var dW = rotated ? sL : sW;
  var dN = rotated ? n : m;
  var dM = rotated ? m : n;
  var dPL = rotated ? pW : pL;
  var dPW = rotated ? pL : pW;
  var dTR = rotated ? tC : tR;
  var dTC = rotated ? tR : tC;
  var dTL = rotated === !!props.tagRotated ? tL : tW;
  var dTW = rotated === !!props.tagRotated ? tW : tL;
  function getPreviewMargins(pieceL_val, pieceW_val) {
    if (!isHandFeed) {
      var shortSide = Math.min(pieceL_val, pieceW_val);
      var longSide = Math.max(pieceL_val, pieceW_val);
      var usableShort = Math.max(0, shortSide - 0.6);
      var usableLong = Math.max(0, longSide - 0.5);
      var uL = (pieceL_val <= pieceW_val) ? usableShort : usableLong;
      var uW = (pieceL_val <= pieceW_val) ? usableLong : usableShort;
      return {
        usableL: uL,
        usableW: uW,
        mL: (pieceL_val - uL) / 2,
        mW: (pieceW_val - uW) / 2
      };
    }
    return {
      usableL: Math.max(0, pieceL_val - 2 * margin),
      usableW: Math.max(0, pieceW_val - 2 * margin),
      mL: margin,
      mW: margin
    };
  }
  var pm = getPreviewMargins(dPL, dPW);
  var usableDL = pm.usableL;
  var usableDW = pm.usableW;
  var pitchDL = dTL + 2 * overlap;
  var pitchDW = dTW + 2 * overlap;
  var svgTR = pitchDL > 0 ? Math.floor((usableDL + 2 * overlap) / pitchDL) : 0;
  var svgTC = pitchDW > 0 ? Math.floor((usableDW + 2 * overlap) / pitchDW) : 0;

  var svgDrawnPerPiece = svgTR * svgTC + rotColCount + rotRowCount;
  if (valid && optTagsPerPiece > 0 && svgDrawnPerPiece !== optTagsPerPiece) {
    try { console.warn('LAYOUT MISMATCH: SVG drawn tags/piece (' + svgDrawnPerPiece + ' = main ' + svgTR + 'x' + svgTC + ' + reclaimed ' + rotColCount + '+' + rotRowCount + ') !== reported tags/piece (' + optTagsPerPiece + '). Piece: ' + lpFmt(pL) + 'x' + lpFmt(pW) + ' Tag: ' + lpFmt(tL) + 'x' + lpFmt(tW) + ' Overlap: ' + lpFmt(overlap) + ' Margin: ' + lpFmt(margin)); } catch(e) {}
  }

  var geo = React.useMemo(function() {
    if (!valid) return null;
    var VB_W = 880, PAD_T = 44, PAD_R = 48, PAD_L = 72, PAD_B = 46;
    var cW = VB_W - PAD_L - PAD_R;
    var cH = 480 - PAD_T - PAD_B;
    var sc = Math.min(cW / dL, cH / dW);
    var shW = dL * sc, shH = dW * sc;
    var VB_H = Math.max(280, Math.min(540, PAD_T + shH + PAD_B));
    cH = VB_H - PAD_T - PAD_B;
    sc = Math.min(cW / dL, cH / dW);
    shW = dL * sc; shH = dW * sc;
    var oX = PAD_L + (cW - shW) / 2;
    var oY = PAD_T + (cH - shH) / 2;
    var pw = dPL * sc, ph = dPW * sc;
    var tw = dTL * sc, th = dTW * sc;
    var wasteRight = Math.max(0, dL - dN * dPL) * sc;
    var wasteBottom = Math.max(0, dW - dM * dPW) * sc;
    var fsT = Math.max(13, Math.min(22, sc * 1.05));
    var fsD = Math.max(12, Math.min(18, sc * 0.9));
    var fsL = Math.max(9, Math.min(14, sc * 0.7));
    var fsS = Math.max(7.5, Math.min(11, sc * 0.5));
    var swT = Math.max(0.4, Math.min(1, sc * 0.04));
    var swM = Math.max(0.8, Math.min(1.8, sc * 0.07));
    var swE = Math.max(1.2, Math.min(2.5, sc * 0.1));
    var dimOff = Math.max(16, Math.min(30, sc * 2.2));
    return {
      VB_W: VB_W, VB_H: VB_H, oX: oX, oY: oY, shW: shW, shH: shH,
      pw: pw, ph: ph, tw: tw, th: th, sc: sc,
      wasteRight: wasteRight, wasteBottom: wasteBottom,
      fsT: fsT, fsD: fsD, fsL: fsL, fsS: fsS,
      swT: swT, swM: swM, swE: swE, dimOff: dimOff
    };
  }, [dL, dW, dPL, dPW, dTL, dTW, dN, dM, valid]);

  if (!valid || !geo) {
    return (
      <div className="lp-shell">
      <div className="lp-title-bar">
        <span>{viewMode === "die" ? "SINGLE DIE VIEW" : "DIE LAYOUT (SHEET NESTING)"}</span>
        <span className="lp-title-sub">
          {viewMode === "die"
            ? (props.isMultiTag
                ? ("Die Board: " + lpFmt(dPL) + " × " + lpFmt(dPW) + " | Combo Die: " + (props.multiTagsList ? props.multiTagsList.length : 0) + " Tags (" + (props.selectedC ? (props.selectedC.upsPerTag || 1) : 1) + " UP each, " + (props.selectedC ? props.selectedC.tagsPerPieceNominal : optTagsPerPiece) + " UP total) | " + dateStr)
                : ("Die Board: " + lpFmt(dPL) + " × " + lpFmt(dPW) + " | Tag: " + lpFmt(tL) + " × " + lpFmt(tW) + " | " + (props.selectedC ? props.selectedC.tagsPerPieceNominal : optTagsPerPiece) + " Tags/Die | " + dateStr))
            : (props.isMultiTag
                ? ("Sheet: " + lpFmt(sL) + " × " + lpFmt(sW) + " | Combo Die: " + (props.multiTagsList ? props.multiTagsList.length : 0) + " Tags (" + (props.selectedC ? (props.selectedC.upsPerTag || 1) : 1) + " UP each, " + (props.selectedC ? props.selectedC.tagsPerPieceNominal : optTagsPerPiece) + " UP total) | Overlap: " + lpFmt(overlap) + " | " + (!isHandFeed ? ("Offset Margin: 0.6\"/0.5\" (Printable: " + lpFmt(pm.usableL) + " × " + lpFmt(pm.usableW) + "\")") : ("Margin: " + lpFmt(margin) + "\"")) + " | " + dateStr)
                : ("Sheet: " + lpFmt(sL) + " × " + lpFmt(sW) + " | Tag: " + lpFmt(tL) + " × " + lpFmt(tW) + " | Overlap: " + lpFmt(overlap) + " | " + (!isHandFeed ? ("Offset Margin: 0.6\"/0.5\" (Printable: " + lpFmt(pm.usableL) + " × " + lpFmt(pm.usableW) + "\")") : ("Margin: " + lpFmt(margin) + "\"")) + " | " + dateStr))
          }
        </span>
      </div>
        <div className="lp-preview-empty">
          <svg viewBox="0 0 400 250" className="lp-svg"><text x="200" y="130" textAnchor="middle" fontSize="16" fontWeight="600" fill="#aaa" fontFamily="'Courier New',monospace">No valid layout generated</text></svg>
        </div>
      </div>
    );
  }

  var oX = geo.oX, oY = geo.oY, shW = geo.shW, shH = geo.shH;
  var pw = geo.pw, ph = geo.ph, tw = geo.tw, th = geo.th;
  var wasteR = geo.wasteRight, wasteB = geo.wasteBottom;
  var dimY = oY - geo.dimOff;
  var dimX = oX + shW + geo.dimOff;
  var eO = 4;
  var now = new Date();
  var dateStr = now.getDate() + "/" + (now.getMonth() + 1) + "/" + now.getFullYear();

  var L = { cut: true, bleed: true, safe: true, hole: true, center: true };
  var sc = geo.sc;

  var isMixedCandidate = !!(props.selectedC && props.selectedC.isMixed && props.selectedC.strips && props.selectedC.strips.length > 0);
  var stripsAreCols = isMixedCandidate && (
    (props.selectedC.stripAxis === 'W' && rotated) ||
    (props.selectedC.stripAxis === 'L' && !rotated) ||
    (!props.selectedC.stripAxis && props.selectedC.strips.length === dN && props.selectedC.strips.length !== dM)
  );

  var pieceRowHeights = React.useMemo(function() {
    if (!valid) return [];
    if (isMixedCandidate) {
      if (stripsAreCols) {
        return Array.from({ length: dM }).map(function() {
          return {
            inches: rotated ? props.selectedC.strips[0].L : props.selectedC.strips[0].W,
            isOffcut: false,
            tags: optTagsPerPiece
          };
        });
      } else {
        return props.selectedC.strips.map(function(s) {
          return {
            inches: rotated ? s.L : s.W,
            isOffcut: !!s.isOffcut,
            tags: s.tagsPerStrip || (s.rows * s.cols)
          };
        });
      }
    }
    return Array.from({ length: dM }).map(function() {
      return {
        inches: dPW,
        isOffcut: false,
        tags: optTagsPerPiece
      };
    });
  }, [valid, isMixedCandidate, stripsAreCols, props.selectedC, rotated, dM, dPW, optTagsPerPiece]);

  var pieceColWidths = React.useMemo(function() {
    if (!valid) return [];
    if (isMixedCandidate) {
      if (stripsAreCols) {
        return props.selectedC.strips.map(function(s) {
          return {
            inches: rotated ? s.W : s.L,
            isOffcut: !!s.isOffcut,
            tags: s.tagsPerStrip || (s.rows * s.cols)
          };
        });
      } else {
        return Array.from({ length: dN }).map(function() {
          return {
            inches: rotated ? props.selectedC.strips[0].W : props.selectedC.strips[0].L,
            isOffcut: false,
            tags: optTagsPerPiece
          };
        });
      }
    }
    return Array.from({ length: dN }).map(function() {
      return {
        inches: dPL,
        isOffcut: false
      };
    });
  }, [valid, isMixedCandidate, stripsAreCols, props.selectedC, rotated, dN, dPL, optTagsPerPiece]);

  var pieceSummaryList = React.useMemo(function() {
    if (!valid) return [];
    if (isMixedCandidate) {
      var map = {};
      props.selectedC.strips.forEach(function(s) {
        var dimX = rotated ? s.W : s.L;
        var dimY = rotated ? s.L : s.W;
        var key = lpFmt(dimX) + "x" + lpFmt(dimY) + (s.isOffcut ? "_off" : "");
        if (!map[key]) {
          map[key] = {
            dimText: lpFmt(dimX) + " × " + lpFmt(dimY) + '"',
            isOffcut: !!s.isOffcut,
            count: 0,
            tagsPerPiece: s.tagsPerStrip || (s.rows * s.cols)
          };
        }
        map[key].count += (s.count || 1);
      });
      return Object.keys(map).map(function(k) { return map[k]; });
    }
    return [{
      dimText: lpFmt(dPL) + " × " + lpFmt(dPW) + '"',
      isOffcut: false,
      count: n * m,
      tagsPerPiece: optTagsPerPiece
    }];
  }, [valid, isMixedCandidate, props.selectedC, rotated, dPL, dPW, n, m, optTagsPerPiece]);

  var totalPiecesCount = pieceSummaryList.reduce(function(sum, item) { return sum + item.count; }, 0);

  var nominalLayoutSpanX = isMixedCandidate
    ? (stripsAreCols
        ? (props.selectedC.strips.reduce(function(sum, s) { return sum + (rotated ? s.W : s.L); }, 0) * sc)
        : (dN * (rotated ? props.selectedC.strips[0].W : props.selectedC.strips[0].L) * sc))
    : (dN * pw);
  var nominalLayoutSpanY = isMixedCandidate
    ? (stripsAreCols
        ? (dM * (rotated ? props.selectedC.strips[0].L : props.selectedC.strips[0].W) * sc)
        : (props.selectedC.strips.reduce(function(sum, s) { return sum + (rotated ? s.L : s.W); }, 0) * sc))
    : (dM * ph);
  var unusedX = Math.max(0, shW - nominalLayoutSpanX);
  var unusedY = Math.max(0, shH - nominalLayoutSpanY);
  var startOriginX = oX + unusedX / 2;
  var startOriginY = oY + unusedY / 2;

  return (
    <div className="lp-shell">
      <div className="lp-title-bar">
        <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", flex: 1 }}>
          <span>{viewMode === "die" ? "SINGLE DIE VIEW" : "DIE LAYOUT (SHEET NESTING)"}</span>
          <span className="lp-title-sub">
            {viewMode === "die"
              ? (props.isMultiTag
                  ? ("Die Board: " + lpFmt(dPL) + " × " + lpFmt(dPW) + " | Combo Die: " + (props.multiTagsList ? props.multiTagsList.length : 0) + " Tags (" + (props.selectedC ? (props.selectedC.formationLabel || (props.selectedC.totalSlots + " UP")) : "") + ") | " + dateStr)
                  : ("Die Board: " + lpFmt(dPL) + " × " + lpFmt(dPW) + " | Tag: " + lpFmt(tL) + " × " + lpFmt(tW) + " | " + (props.selectedC ? props.selectedC.tagsPerPieceNominal : optTagsPerPiece) + " Tags/Die | " + dateStr))
              : (props.isMultiTag
                  ? ("Sheet: " + lpFmt(sL) + " × " + lpFmt(sW) + " | Combo Die: " + (props.multiTagsList ? props.multiTagsList.length : 0) + " Tags (" + (props.selectedC ? (props.selectedC.formationLabel || (props.selectedC.totalSlots + " UP")) : "") + ") | Overlap: " + lpFmt(overlap) + " | " + (!isHandFeed ? ("Offset Margin: 0.6\"/0.5\" (Printable: " + lpFmt(pm.usableL) + " × " + lpFmt(pm.usableW) + "\")") : ("Margin: " + lpFmt(margin) + "\"")) + " | " + dateStr)
                  : ("Sheet: " + lpFmt(sL) + " × " + lpFmt(sW) + " | Tag: " + lpFmt(tL) + " × " + lpFmt(tW) + " | Overlap: " + lpFmt(overlap) + " | " + (!isHandFeed ? ("Offset Margin: 0.6\"/0.5\" (Printable: " + lpFmt(pm.usableL) + " × " + lpFmt(pm.usableW) + "\")") : ("Margin: " + lpFmt(margin) + "\"")) + " | " + dateStr))
            }
          </span>
        </div>

        {/* Zoom Controls in Title Bar */}
        <div className="lp-zoom-bar" style={{
          display: "inline-flex",
          alignItems: "center",
          gap: 2,
          background: "rgba(15, 23, 42, 0.8)",
          padding: "2px 6px",
          borderRadius: 6,
          border: "1px solid rgba(255, 255, 255, 0.15)"
        }}>
          <button type="button" onClick={handleZoomOut} disabled={zoom <= 0.5} style={{
            background: "none", border: "none", color: zoom <= 0.5 ? "#475569" : "#e2e8f0",
            cursor: zoom <= 0.5 ? "default" : "pointer", padding: "2px 7px", fontSize: 13, fontWeight: 700, borderRadius: 3,
            display: "inline-flex", alignItems: "center", justifyContent: "center"
          }} title="Zoom Out (-25%)">
            <Minus size={13} />
          </button>
          <button type="button" onClick={handleZoomReset} style={{
            background: "rgba(56, 189, 248, 0.14)", border: "1px solid rgba(56, 189, 248, 0.35)",
            borderRadius: 4, color: "#38bdf8", cursor: "pointer", padding: "2px 7px",
            fontSize: 12, fontFamily: "'Courier New', monospace", fontWeight: 700, minWidth: 46
          }} title="Click to Reset Zoom (100%)">
            {Math.round(zoom * 100)}%
          </button>
          <button type="button" onClick={handleZoomIn} disabled={zoom >= 3} style={{
            background: "none", border: "none", color: zoom >= 3 ? "#475569" : "#e2e8f0",
            cursor: zoom >= 3 ? "default" : "pointer", padding: "2px 7px", fontSize: 13, fontWeight: 700, borderRadius: 3,
            display: "inline-flex", alignItems: "center", justifyContent: "center"
          }} title="Zoom In (+25%)">
            <Plus size={13} />
          </button>
          <button type="button" onClick={handleZoomReset} style={{
            background: "none", border: "none", borderLeft: "1px solid rgba(255,255,255,0.15)",
            color: "#94a3b8", cursor: "pointer", padding: "2px 7px", fontSize: 11.5, fontWeight: 600
          }} title="Fit to View (100%)">
            Fit
          </button>
        </div>
      </div>
      <div className="lp-main">
        <div className="lp-drawing-col">
          {viewMode === "sheet" && (
            <div className="lp-piece-spec-bar" style={{
              display: "flex",
              alignItems: "flex-start",
              justifyContent: "space-between",
              background: "#182232",
              border: "1px solid rgba(56, 189, 248, 0.3)",
              borderRadius: 6,
              padding: "10px 14px",
              marginBottom: 9,
              fontSize: 13.5,
              color: "#e2e8f0",
              gap: 16,
              flexWrap: "wrap"
            }}>
              <div style={{ display: "flex", alignItems: "flex-start", gap: 14, flexWrap: "wrap" }}>
                <span className="lp-piece-spec-title" style={{ fontWeight: 800, color: "#38bdf8", letterSpacing: "0.5px", fontSize: 14, paddingTop: 4, whiteSpace: "nowrap" }}>
                  ✂️ PIECE SIZES:
                </span>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 6 }}>
                  {pieceSummaryList.map(function(item, idx) {
                    return (
                      <span key={idx} className={item.isOffcut ? "lp-piece-badge-offcut" : "lp-piece-badge-main"} style={{
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 8,
                        background: item.isOffcut ? "rgba(245, 158, 11, 0.15)" : "rgba(56, 189, 248, 0.12)",
                        border: "1px solid " + (item.isOffcut ? "#f59e0b" : "#38bdf8"),
                        color: item.isOffcut ? "#fbbf24" : "#e0f2fe",
                        padding: "4px 12px",
                        borderRadius: 5,
                        fontWeight: 700,
                        fontSize: 13,
                        fontFamily: "'Courier New',monospace"
                      }}>
                        <span className="lp-badge-text">{item.count} pcs × <strong style={{ fontSize: 13.5 }}>{item.dimText}</strong></span>
                        <span className="lp-badge-sub" style={{ fontSize: 12, opacity: 0.9, fontWeight: 600 }}>({item.tagsPerPiece} tags/pc{item.isOffcut ? " • Offcut" : ""})</span>
                      </span>
                    );
                  })}
                </div>
              </div>
              <div className="lp-piece-total-box" style={{ fontSize: 12.5, color: "#94a3b8", paddingTop: 4 }}>
                Total: <strong style={{ color: "#f8fafc", fontSize: 13.5 }}>{totalPiecesCount} pieces</strong> ({num(totalTags, 0)} tags/sheet)
              </div>
            </div>
          )}
          <div
            className="lp-drawing"
            ref={drawingRef}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            onWheel={handleWheel}
            style={{
              position: "relative",
              overflow: "auto",
              maxHeight: "760px",
              cursor: isDragging ? "grabbing" : (zoom > 1 ? "grab" : "default"),
              userSelect: isDragging ? "none" : "auto"
            }}
          >
            <div style={{
              width: (zoom * 100) + "%",
              minWidth: (zoom * 100) + "%",
              maxWidth: (zoom * 100) + "%",
              margin: "0 auto",
              transition: isDragging ? "none" : "width 0.12s ease-out"
            }}>
              <svg viewBox={"0 0 " + geo.VB_W + " " + geo.VB_H} preserveAspectRatio="xMidYMid meet" className="lp-svg" role="img" aria-label="Die layout">

              <defs>
                <pattern id="lp-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                  <line x1="0" y1="0" x2="0" y2="6" stroke="#c8bba8" strokeWidth="1" />
                </pattern>
              </defs>

              <rect x="0" y="0" width={geo.VB_W} height={geo.VB_H} fill="#f7f6f3" />

              {viewMode === "sheet" && (
                <>
                  <rect x={oX} y={oY} width={shW} height={shH} fill="#ffffff" stroke="#2a2a2a" strokeWidth={geo.swE} />
                  {wasteR > 0.5 && (
                    <>
                      <rect x={oX} y={oY} width={wasteR / 2} height={shH} fill="url(#lp-hatch)" stroke="none" />
                      <rect x={oX + shW - wasteR / 2} y={oY} width={wasteR / 2} height={shH} fill="url(#lp-hatch)" stroke="none" />
                    </>
                  )}
                  {wasteB > 0.5 && (
                    <>
                      <rect x={oX} y={oY} width={shW} height={wasteB / 2} fill="url(#lp-hatch)" stroke="none" />
                      <rect x={oX + shH - wasteB / 2} width={shW} height={wasteB / 2} fill="url(#lp-hatch)" stroke="none" />
                    </>
                  )}
                </>
              )}

              {(() => {
                var pieceGroups = [];
                var reclaimOverlay = [];
                var candBlocks = (props.selectedC && Array.isArray(props.selectedC.blocks) && props.selectedC.blocks.length > 0) ? props.selectedC.blocks : null;

                // --- Single Die View (Zoomed into one piece die board) ---
                if (viewMode === "die") {
                  var dieDisplayW = dPL, dieDisplayH = dPW;
                  var padSvgL = 40, padSvgR = 55, padSvgT = 55, padSvgB = 40;
                  var availW = geo.VB_W - padSvgL - padSvgR;
                  var availH = geo.VB_H - padSvgT - padSvgB;
                  var scDie = Math.min(availW / dieDisplayW, availH / dieDisplayH);
                  var dieBoxW = dieDisplayW * scDie, dieBoxH = dieDisplayH * scDie;
                  var oX_die = padSvgL + (availW - dieBoxW) / 2;
                  var oY_die = padSvgT + (availH - dieBoxH) / 2;
                  var pmDie = getPreviewMargins(dieDisplayW, dieDisplayH);
                  var marginDieSvgX = pmDie.mL * scDie;
                  var marginDieSvgY = pmDie.mW * scDie;
                  var usableDieW = pmDie.usableL * scDie;
                  var usableDieH = pmDie.usableW * scDie;

                  var dieElements = [];
                  var dieTitle = props.isMultiTag
                    ? ("TAGGERS_COMBO_DIE_" + (props.multiTagsList ? props.multiTagsList.length : 0) + "_TAGS_" + (props.selectedC ? props.selectedC.tagsPerPieceNominal : optTagsPerPiece) + "_UP")
                    : ("TAGGERS_DIE_" + lpFmt(tL) + "x" + lpFmt(tW) + "_" + (props.selectedC ? props.selectedC.tagsPerPieceNominal : optTagsPerPiece) + "_UP");

                  if (candBlocks) {
                    var dieMaxX = 0, dieMaxY = 0;
                    candBlocks.forEach(function(b) {
                      var isSh = (props.removeSameTagBleed != null) ? !!props.removeSameTagBleed : !!b.sharedCut;
                      var bSpanX = (rotated ? (b.xOffset + b.cols * (isSh ? b.tagW : b.cutW)) : (b.yOffset + b.rows * (isSh ? b.tagL : b.cutL)));
                      var bSpanY = (rotated ? (b.yOffset + b.rows * (isSh ? b.tagL : b.cutL)) : (b.xOffset + b.cols * (isSh ? b.tagW : b.cutW)));
                      if (!isSh) { bSpanX -= 2 * overlap; bSpanY -= 2 * overlap; }
                      if (bSpanX > dieMaxX) dieMaxX = bSpanX;
                      if (bSpanY > dieMaxY) dieMaxY = bSpanY;
                    });
                    var padX = Math.max(0, (usableDieW - dieMaxX * scDie) / 2);
                    var padY = Math.max(0, (usableDieH - dieMaxY * scDie) / 2);
                    var tagCounter = 0;

                    candBlocks.forEach(function(b, bi) {
                      var isSh = (props.removeSameTagBleed != null) ? !!props.removeSameTagBleed : !!b.sharedCut;
                      var bOffX = (rotated ? b.xOffset : b.yOffset) * scDie;
                      var bOffY = (rotated ? b.yOffset : b.xOffset) * scDie;
                      var tw = (rotated ? b.tagW : b.tagL) * scDie;
                      var th = (rotated ? b.tagL : b.tagW) * scDie;
                      var pitchX = (rotated ? (isSh ? b.tagW : b.cutW) : (isSh ? b.tagL : b.cutL)) * scDie;
                      var pitchY = (rotated ? (isSh ? b.tagL : b.cutL) : (isSh ? b.tagW : b.cutW)) * scDie;

                      var loopCols = rotated ? b.cols : b.rows;
                      var loopRows = rotated ? b.rows : b.cols;

                      for (var br = 0; br < loopRows; br++) {
                        for (var bc = 0; bc < loopCols; bc++) {
                          tagCounter++;
                          var tx = oX_die + marginDieSvgX + padX + bOffX + bc * pitchX;
                          var ty = oY_die + marginDieSvgY + padY + bOffY + br * pitchY;
                          var tagId = b.tagPrefix ? (b.tagPrefix + (br * loopCols + bc + 1)) : ("T" + String(tagCounter));
                          var showId = tw > 16 && th > 12;
                          var idFontSize = Math.max(6, Math.min(10, scDie * 0.45));

                          dieElements.push(
                            <g key={"dt-" + bi + "-" + br + "-" + bc}>
                              {renderTagShape({
                                x: tx, y: ty, w: tw, h: th, sc: scDie,
                                style: TAG_STYLE, layers: L,
                                id: tagId, showId: showId, idFontSize: idFontSize,
                                tagColor: b.tagColor,
                                crease: !!b.crease,
                                sharedCut: isSh
                              })}
                            </g>
                          );
                        }
                      }
                    });
                  }

                  var dDimY = oY_die - 14;
                  var dDimX = oX_die + dieBoxW + 18;

                  return [
                    <g key="single-die-view">
                      {/* Die Board outline */}
                      <rect x={oX_die} y={oY_die} width={dieBoxW} height={dieBoxH} fill="#ffffff" stroke="#2a2a2a" strokeWidth="2.2" />
                      
                      {/* Die Title */}
                      <text x={oX_die + 4} y={oY_die - 28} fontSize="14" fontWeight="700" fill="#222" fontFamily="'Courier New',monospace">{dieTitle}</text>
                      
                      {/* Top Horizontal Dimension */}
                      <line x1={oX_die} y1={oY_die - 2} x2={oX_die} y2={dDimY - 4} stroke="#444" strokeWidth="0.8" />
                      <line x1={oX_die + dieBoxW} y1={oY_die - 2} x2={oX_die + dieBoxW} y2={dDimY - 4} stroke="#444" strokeWidth="0.8" />
                      <line x1={oX_die - 2} y1={dDimY} x2={oX_die + dieBoxW + 2} y2={dDimY} stroke="#444" strokeWidth="0.8" />
                      <polygon points={oX_die + "," + dDimY + " " + (oX_die + 4) + "," + (dDimY - 1.5) + " " + (oX_die + 4) + "," + (dDimY + 1.5)} fill="#444" />
                      <polygon points={(oX_die + dieBoxW) + "," + dDimY + " " + (oX_die + dieBoxW - 4) + "," + (dDimY - 1.5) + " " + (oX_die + dieBoxW - 4) + "," + (dDimY + 1.5)} fill="#444" />
                      <text x={oX_die + dieBoxW / 2} y={dDimY - 5} textAnchor="middle" fontSize="12" fontWeight="600" fill="#333" fontFamily="'Courier New',monospace">{lpFmt(dieDisplayW)}"</text>

                      {/* Right Vertical Dimension */}
                      <line x1={oX_die + dieBoxW + 2} y1={oY_die} x2={dDimX + 4} y2={oY_die} stroke="#444" strokeWidth="0.8" />
                      <line x1={oX_die + dieBoxW + 2} y1={oY_die + dieBoxH} x2={dDimX + 4} y2={oY_die + dieBoxH} stroke="#444" strokeWidth="0.8" />
                      <line x1={dDimX} y1={oY_die - 2} x2={dDimX} y2={oY_die + dieBoxH + 2} stroke="#444" strokeWidth="0.8" />
                      <polygon points={dDimX + "," + oY_die + " " + (dDimX - 1.5) + "," + (oY_die + 4) + " " + (dDimX + 1.5) + "," + (oY_die + 4)} fill="#444" />
                      <polygon points={dDimX + "," + (oY_die + dieBoxH) + " " + (dDimX - 1.5) + "," + (oY_die + dieBoxH - 4) + " " + (dDimX + 1.5) + "," + (oY_die + dieBoxH - 4)} fill="#444" />
                      <text x={dDimX + 5} y={oY_die + dieBoxH / 2} textAnchor="start" fontSize="12" fontWeight="600" fill="#333" fontFamily="'Courier New',monospace" dominantBaseline="middle" transform={"rotate(90 " + (dDimX + 5) + " " + (oY_die + dieBoxH / 2) + ")"}>{lpFmt(dieDisplayH)}"</text>

                      {/* Die Tags */}
                      {dieElements}
                    </g>,
                    null
                  ];
                }

                // --- Sheet View with Blocks / Hybrid Dies ---
                if (candBlocks) {
                  var dieMaxX = 0, dieMaxY = 0;
                  candBlocks.forEach(function(b) {
                    var isSh = (props.removeSameTagBleed != null) ? !!props.removeSameTagBleed : !!b.sharedCut;
                    var bSpanX = (rotated ? (b.xOffset + b.cols * (isSh ? b.tagW : b.cutW)) : (b.yOffset + b.rows * (isSh ? b.tagL : b.cutL)));
                    var bSpanY = (rotated ? (b.yOffset + b.rows * (isSh ? b.tagL : b.cutL)) : (b.xOffset + b.cols * (isSh ? b.tagW : b.cutW)));
                    if (!isSh) { bSpanX -= 2 * overlap; bSpanY -= 2 * overlap; }
                    if (bSpanX > dieMaxX) dieMaxX = bSpanX;
                    if (bSpanY > dieMaxY) dieMaxY = bSpanY;
                  });

                  var nominalLayoutSpanX = dN * pw;
                  var nominalLayoutSpanY = dM * ph;
                  var unusedX = Math.max(0, shW - nominalLayoutSpanX);
                  var unusedY = Math.max(0, shH - nominalLayoutSpanY);
                  var startOriginX = oX + unusedX / 2;
                  var startOriginY = oY + unusedY / 2;

                  var pmSheet = getPreviewMargins(dPL, dPW);
                  var usableSvgW = pmSheet.usableL * sc;
                  var usableSvgH = pmSheet.usableW * sc;
                  var padX = Math.max(0, (usableSvgW - dieMaxX * sc) / 2);
                  var padY = Math.max(0, (usableSvgH - dieMaxY * sc) / 2);
                  var marginSvgX = pmSheet.mL * sc;
                  var marginSvgY = pmSheet.mW * sc;

                  var tagsPerPiece = candBlocks.reduce(function(acc, b) { return acc + b.count; }, 0);

                  for (var row = 0; row < dM; row++) {
                    for (var col = 0; col < dN; col++) {
                      var px = startOriginX + col * pw;
                      var py = startOriginY + row * ph;
                      var pieceIdx = row * dN + col;
                      var startTagNum = pieceIdx * tagsPerPiece;
                      var tagInPiece = 0;
                      var blockEls = [];

                      candBlocks.forEach(function(b, bi) {
                        var isSh = (props.removeSameTagBleed != null) ? !!props.removeSameTagBleed : !!b.sharedCut;
                        var bOffX = (rotated ? b.xOffset : b.yOffset) * sc;
                        var bOffY = (rotated ? b.yOffset : b.xOffset) * sc;
                        var tw = (rotated ? b.tagW : b.tagL) * sc;
                        var th = (rotated ? b.tagL : b.tagW) * sc;
                        var pitchX = (rotated ? (isSh ? b.tagW : b.cutW) : (isSh ? b.tagL : b.cutL)) * sc;
                        var pitchY = (rotated ? (isSh ? b.tagL : b.cutL) : (isSh ? b.tagW : b.cutW)) * sc;

                        var loopCols = rotated ? b.cols : b.rows;
                        var loopRows = rotated ? b.rows : b.cols;

                        for (var br = 0; br < loopRows; br++) {
                          for (var bc = 0; bc < loopCols; bc++) {
                            tagInPiece++;
                            var tagNum = startTagNum + tagInPiece;
                            var tx = px + marginSvgX + padX + bOffX + bc * pitchX;
                            var ty = py + marginSvgY + padY + bOffY + br * pitchY;
                            var tagId = b.tagPrefix ? (b.tagPrefix + (br * loopCols + bc + 1)) : ("T" + String(tagNum));
                            var showId = tw > 14 && th > 10;
                            var idFontSize = Math.max(5, Math.min(8, sc * 0.45));

                            blockEls.push(
                              <g key={"t-" + row + "-" + col + "-" + bi + "-" + br + "-" + bc}>
                                {renderTagShape({
                                  x: tx, y: ty, w: tw, h: th, sc: sc,
                                  style: TAG_STYLE, layers: L,
                                  id: tagId, showId: showId, idFontSize: idFontSize,
                                  tagColor: b.tagColor,
                                  crease: !!b.crease,
                                  sharedCut: isSh
                                })}
                              </g>
                            );
                          }
                        }
                      });

                      var pieceDimText = lpFmt(dPL) + '" × ' + lpFmt(dPW) + '"';
                      pieceGroups.push(
                        <g key={"p-" + row + "-" + col}>
                          <rect x={px} y={py} width={pw} height={ph} fill="#ffffff" stroke="#888" strokeWidth={geo.swT} />
                          <title>{"Piece " + (pieceIdx + 1) + ": " + pieceDimText}</title>
                          <text x={px + 3} y={py + 8} fontSize={Math.max(6, Math.min(8.5, sc * 0.42))} fontWeight="700" fill="#64748b" fontFamily="'Courier New',monospace">
                            P{pieceIdx + 1}
                          </text>
                          {blockEls}
                        </g>
                      );
                    }
                  }

                  return [pieceGroups, null];
                }

                // --- Whole-sheet centering: compute nominal layout span then center it ---
                // Each piece occupies exactly pw × ph (nominal, no extension for centering calc).
                // If reclaim extends a piece, we use the nominal span for the centering offset
                // so the centered layout looks balanced even when one edge has a reclaim pocket.
                var isMixedCandidate = !!(props.selectedC && props.selectedC.isMixed && props.selectedC.strips && props.selectedC.strips.length > 0);
                var stripsAreCols = isMixedCandidate && (
                  (props.selectedC.stripAxis === 'W' && rotated) ||
                  (props.selectedC.stripAxis === 'L' && !rotated) ||
                  (!props.selectedC.stripAxis && props.selectedC.strips.length === dN && props.selectedC.strips.length !== dM)
                );
                var numRows = isMixedCandidate ? (stripsAreCols ? dM : props.selectedC.strips.length) : dM;
                var numCols = isMixedCandidate ? (stripsAreCols ? props.selectedC.strips.length : dN) : dN;

                var nominalLayoutSpanX = isMixedCandidate
                  ? (stripsAreCols
                      ? (props.selectedC.strips.reduce(function(sum, s) { return sum + (rotated ? s.W : s.L); }, 0) * sc)
                      : (dN * (rotated ? props.selectedC.strips[0].W : props.selectedC.strips[0].L) * sc))
                  : (dN * pw);
                var nominalLayoutSpanY = isMixedCandidate
                  ? (stripsAreCols
                      ? (dM * (rotated ? props.selectedC.strips[0].L : props.selectedC.strips[0].W) * sc)
                      : (props.selectedC.strips.reduce(function(sum, s) { return sum + (rotated ? s.L : s.W); }, 0) * sc))
                  : (dM * ph);
                var unusedX = Math.max(0, shW - nominalLayoutSpanX);
                var unusedY = Math.max(0, shH - nominalLayoutSpanY);
                var startOriginX = oX + unusedX / 2;
                var startOriginY = oY + unusedY / 2;

                var currY = startOriginY;
                var maxX = startOriginX;
                var maxY = startOriginY;

                Array.from({ length: numRows }).forEach(function(_, row) {
                  var currX = startOriginX;
                  var maxRowHeight = 0;

                  Array.from({ length: numCols }).forEach(function(_, col) {
                    var strip = isMixedCandidate ? (stripsAreCols ? props.selectedC.strips[col] : props.selectedC.strips[row]) : null;
                    var pieceDimX = isMixedCandidate ? (rotated ? strip.W : strip.L) : dPL;
                    var pieceDimY = isMixedCandidate ? (rotated ? strip.L : strip.W) : dPW;
                    var rowPh = pieceDimY * sc;
                    var rowPw = pieceDimX * sc;
                    if (rowPh > maxRowHeight) maxRowHeight = rowPh;

                    var px = currX;
                    var py = currY;
                    var pmCur = getPreviewMargins(pieceDimX, pieceDimY);
                    var marginSvgX = pmCur.mL * sc;
                    var marginSvgY = pmCur.mW * sc;
                    var overlapSvg = overlap * sc;

                    var curSvgTR = isMixedCandidate ? (rotated ? strip.cols : strip.rows) : svgTR;
                    var curSvgTC = isMixedCandidate ? (rotated ? strip.rows : strip.cols) : svgTC;

                    var isTagRot = !!(props.selectedC && props.selectedC.optimization && props.selectedC.optimization.isTagRotated);
                    var tagDimX = isMixedCandidate
                      ? (rotated ? (isTagRot ? tL : tW) : (isTagRot ? tW : tL))
                      : dTL;
                    var tagDimY = isMixedCandidate
                      ? (rotated ? (isTagRot ? tW : tL) : (isTagRot ? tL : tW))
                      : dTW;
                    var curTw = tagDimX * sc;
                    var curTh = tagDimY * sc;

                    var pitchX = curTw + 2 * overlapSvg;
                    var pitchY = curTh + 2 * overlapSvg;
                    var pIdx = row * numCols + col + 1;

                    var usableW = pmCur.usableL * sc;
                    var usableH = pmCur.usableW * sc;
                    var gridW = curSvgTR > 0 ? (curSvgTR * curTw + (curSvgTR - 1) * 2 * overlapSvg) : 0;
                    var gridH = curSvgTC > 0 ? (curSvgTC * curTh + (curSvgTC - 1) * 2 * overlapSvg) : 0;

                    var hasExtra = Number(props.reclaimedTags) > 0 || rotRowCount > 0 || rotColCount > 0 || cornerCount > 0;
                    var isCornerFit = isCornerFitCandidate;
                    var hasBtmRm = !simpleMode && rotColCount > 0 && isHandFeed && !isCornerFit;
                    var btmReclaimH = hasBtmRm ? rotColCount : 0;
                    var hasRgtRm = !simpleMode && rotRowCount > 0 && isHandFeed && !isCornerFit;
                    var rgtReclaimN = hasRgtRm ? rotRowCount : 0;
                    var hasCornerRm = !simpleMode && isCornerFit && cornerCount > 0 && isHandFeed;

                    var recClaimH = (btmReclaimH > 0) ? th : 0;
                    var recClaimW = (rgtReclaimN > 0) ? th : 0;
                    // Corner-fit: adds one tag in the bottom-right pocket; its dimensions from optimizer
                    var cTW_svg = hasCornerRm ? cornerTagL * sc : 0; // cornerTagL is along L axis = x in SVG
                    var cTH_svg = hasCornerRm ? cornerTagW * sc : 0; // cornerTagW is along W axis = y in SVG
                    var recClaimW_corner = 0; // corner-fit extends both axes, not just one
                    var contentW = gridW + Math.max(recClaimW, cTW_svg);
                    var contentH = gridH + Math.max(recClaimH, cTH_svg);

                    var firstTagX = px + marginSvgX + Math.max(0, (usableW - gridW) / 2);
                    var firstTagY = py + marginSvgY + Math.max(0, (usableH - gridH) / 2);
                    var lastTagEndX = firstTagX + gridW;
                    var lastTagEndY = firstTagY + gridH;

                    // Piece extension: strip extends in one axis; corner-fit extends in both
                    var extPw = hasCornerRm
                      ? Math.max(rowPw, (lastTagEndX + cTW_svg + marginSvgX) - px)
                      : Math.max(rowPw, (lastTagEndX + Math.max(recClaimW, 0) + marginSvgX) - px);
                    var extPh = hasCornerRm
                      ? Math.max(rowPh, (lastTagEndY + cTH_svg + marginSvgY) - py)
                      : Math.max(rowPh, (lastTagEndY + recClaimH + marginSvgY) - py);

                    var leftStrip = Math.max(0, firstTagX - px);
                    var rightStrip = Math.max(0, px + extPw - (firstTagX + contentW));
                    var topStrip = Math.max(0, firstTagY - py);
                    var bottomStrip = Math.max(0, py + extPh - (firstTagY + contentH));

                    currX += extPw;
                    if (extPh > maxRowHeight) {
                      maxRowHeight = extPh;
                    }
                    if (currX > maxX) maxX = currX;
                    if (py + extPh > maxY) maxY = py + extPh;

                    var totalTagsPerPiece = isMixedCandidate ? (strip.tagsPerStrip || (curSvgTR * curSvgTC)) : (curSvgTR * curSvgTC + btmReclaimH + rgtReclaimN + (hasCornerRm ? 1 : 0));
                    var pieceIdx = row * numCols + col;

                    var isOffcutPiece = isMixedCandidate && strip && strip.isOffcut;
                    var pieceDimText = lpFmt(pieceDimX) + '" × ' + lpFmt(pieceDimY) + '"' + (isOffcutPiece ? ' (Offcut)' : '');
                    pieceGroups.push(
                      <g key={"p" + row + "-" + col}>
                        <rect x={px} y={py} width={extPw} height={extPh} fill="#ffffff" stroke={isOffcutPiece ? "#d97706" : "#999"} strokeWidth={geo.swT} strokeDasharray={isOffcutPiece ? "3,2" : undefined} />
                        <title>{"Piece " + pIdx + ": " + pieceDimText + " (" + totalTagsPerPiece + " tags)"}</title>
                        <text x={px + 3} y={py + 8} fontSize={Math.max(6, Math.min(8.5, sc * 0.42))} fontWeight="700" fill={isOffcutPiece ? "#b45309" : "#64748b"} fontFamily="'Courier New',monospace">
                          P{pIdx}
                        </text>
                        {!simpleMode && <>
                        {rightStrip > 0.5 && !hasRgtRm && <rect x={lastTagEndX} y={firstTagY} width={rightStrip} height={gridH} fill="url(#lp-hatch)" stroke="none" />}
                        {leftStrip > 0.5 && <rect x={px} y={firstTagY} width={leftStrip} height={gridH} fill="url(#lp-hatch)" stroke="none" />}
                        {bottomStrip > 0.5 && !hasBtmRm && <rect x={firstTagX} y={lastTagEndY} width={gridW} height={bottomStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {topStrip > 0.5 && <rect x={firstTagX} y={py} width={gridW} height={topStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {leftStrip > 0.5 && topStrip > 0.5 && <rect x={px} y={py} width={leftStrip} height={topStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {rightStrip > 0.5 && topStrip > 0.5 && <rect x={lastTagEndX} y={py} width={rightStrip} height={topStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {leftStrip > 0.5 && bottomStrip > 0.5 && !hasBtmRm && <rect x={px} y={lastTagEndY} width={leftStrip} height={bottomStrip} fill="url(#lp-hatch)" stroke="none" />}
                        {rightStrip > 0.5 && bottomStrip > 0.5 && !hasBtmRm && <rect x={lastTagEndX} y={lastTagEndY} width={rightStrip} height={bottomStrip} fill="url(#lp-hatch)" stroke="none" />}
                        </>}
                        {simpleMode ? (
                          <g>
                            {totalTagsPerPiece > 1 && <text x={px + rowPw / 2} y={py + rowPh / 2} textAnchor="middle" dominantBaseline="central" fontSize={Math.max(6, Math.min(10, sc * 0.5))} fill="#888" fontFamily="'Courier New',monospace">{totalTagsPerPiece} tags</text>}
                          </g>
                        ) : (
                        <g>
                          {Array.from({ length: curSvgTC }).map(function(_, tr) {
                            return Array.from({ length: curSvgTR }).map(function(_, tc) {
                              var tx = firstTagX + tc * pitchX;
                              var ty = firstTagY + tr * pitchY;
                              var baseTagCount = 0;
                              if (isMixedCandidate) {
                                if (stripsAreCols) {
                                  var rowTotalTags = 0;
                                  for (var scIdx = 0; scIdx < props.selectedC.strips.length; scIdx++) {
                                    rowTotalTags += (props.selectedC.strips[scIdx].tagsPerStrip || 0);
                                  }
                                  baseTagCount = row * rowTotalTags;
                                  for (var prevCol = 0; prevCol < col; prevCol++) {
                                    baseTagCount += (props.selectedC.strips[prevCol].tagsPerStrip || 0);
                                  }
                                } else {
                                  for (var si = 0; si < row; si++) {
                                    baseTagCount += (props.selectedC.strips[si].tagsPerStrip || 0) * dN;
                                  }
                                  baseTagCount += col * totalTagsPerPiece;
                                }
                              } else {
                                baseTagCount = pieceIdx * totalTagsPerPiece;
                              }
                              var tagNum = baseTagCount + tr * curSvgTR + tc + 1;
                              
                              var tagId = "T" + String(tagNum);
                              var showId = curTw > 14 && curTh > 10;
                              var idFontSize = Math.max(5, Math.min(8, sc * 0.45));
                              return (
                                <g key={"t" + row + "-" + col + "-" + tr + "-" + tc}>
                                  {renderTagShape({
                                    x: tx, y: ty, w: curTw, h: curTh, sc: sc,
                                    style: TAG_STYLE, layers: L,
                                    id: tagId, showId: showId, idFontSize: idFontSize,
                                  })}
                                </g>
                              );
                            });
                          })}
                        </g>
                        )}
                      </g>
                    );
                    if (!simpleMode) {
                      if (btmReclaimH > 0) {
                        Array.from({ length: btmReclaimH }).forEach(function(_, i) {
                          var rcx = firstTagX + i * (tw + 2 * overlapSvg);
                          var rcy = lastTagEndY;
                          var tagNum = pieceIdx * totalTagsPerPiece + curSvgTR * curSvgTC + i + 1;
                          var tagId = "T" + String(tagNum);
                          var showId = tw > 14 && th > 10;
                          var idFontSize = Math.max(5, Math.min(8, sc * 0.45));
                          reclaimOverlay.push(
                            <g key={"rb-" + row + "-" + col + "-" + i}>
                              {renderTagShape({
                                x: rcx, y: rcy, w: tw, h: th, sc: sc,
                                style: TAG_STYLE, layers: L,
                                id: tagId, showId: showId, idFontSize: idFontSize,
                              })}
                            </g>
                          );
                        });
                      }
                      if (rgtReclaimN > 0) {
                        Array.from({ length: rgtReclaimN }).forEach(function(_, i) {
                          var rcx = lastTagEndX;
                          var rcy = firstTagY + i * (tw + 2 * overlapSvg);
                          var tagNum = pieceIdx * totalTagsPerPiece + curSvgTR * curSvgTC + btmReclaimH + i + 1;
                          var tagId = "T" + String(tagNum);
                          var showId = th > 14 && tw > 10;
                          var idFontSize = Math.max(5, Math.min(8, sc * 0.45));
                          reclaimOverlay.push(
                            <g key={"rr-" + row + "-" + col + "-" + i}>
                              {renderTagShape({
                                x: rcx, y: rcy, w: th, h: tw, sc: sc,
                                style: TAG_STYLE, layers: L,
                                id: tagId, showId: showId, idFontSize: idFontSize,
                              })}
                            </g>
                          );
                        });
                      }
                      if (hasCornerRm) {
                        // Corner-fit: single tag rendered at the bottom-right pocket of the main grid
                        var rcx = lastTagEndX;
                        var rcy = lastTagEndY;
                        var tagNum = pieceIdx * totalTagsPerPiece + svgTR * svgTC + btmReclaimH + rgtReclaimN + 1;
                        var tagId = "T" + String(tagNum);
                        var showId = cTW_svg > 14 && cTH_svg > 10;
                        var idFontSize = Math.max(5, Math.min(8, sc * 0.45));
                        reclaimOverlay.push(
                          <g key={"rc-" + row + "-" + col}>
                            {renderTagShape({
                              x: rcx, y: rcy, w: cTW_svg, h: cTH_svg, sc: sc,
                              style: TAG_STYLE, layers: L,
                              id: tagId, showId: showId, idFontSize: idFontSize,
                            })}
                          </g>
                        );
                      }
                    }
                  });
                  currY += maxRowHeight;
                });

                return [pieceGroups, <g key={"reclaim-overlay"}>{reclaimOverlay}</g>];
              })()}

              {viewMode === "sheet" && (
                <>
                  {/* Top: Sheet Overall Length Dimension */}
                  <g>
                    <line x1={oX} y1={oY - 3} x2={oX} y2={dimY - eO} stroke="#444" strokeWidth={geo.swT} />
                    <line x1={oX + shW} y1={oY - 3} x2={oX + shW} y2={dimY - eO} stroke="#444" strokeWidth={geo.swT} />
                    <line x1={oX - 2} y1={dimY} x2={oX + shW + 2} y2={dimY} stroke="#444" strokeWidth={geo.swT} />
                    <polygon points={oX + "," + dimY + " " + (oX + 4) + "," + (dimY - 1.5) + " " + (oX + 4) + "," + (dimY + 1.5)} fill="#444" />
                    <polygon points={(oX + shW) + "," + dimY + " " + (oX + shW - 4) + "," + (dimY - 1.5) + " " + (oX + shW - 4) + "," + (dimY + 1.5)} fill="#444" />
                    <text x={oX + shW / 2} y={dimY - 5} textAnchor="middle" fontSize={geo.fsD} fontWeight="600" fill="#333" fontFamily="'Courier New',monospace">Sheet: {lpFmt(dL)}"</text>
                  </g>

                  {/* Right: Sheet Overall Width Dimension */}
                  <g>
                    <line x1={oX + shW + 3} y1={oY} x2={dimX + eO} y2={oY} stroke="#444" strokeWidth={geo.swT} />
                    <line x1={oX + shW + 3} y1={oY + shH} x2={dimX + eO} y2={oY + shH} stroke="#444" strokeWidth={geo.swT} />
                    <line x1={dimX} y1={oY - 2} x2={dimX} y2={oY + shH + 2} stroke="#444" strokeWidth={geo.swT} />
                    <polygon points={dimX + "," + oY + " " + (dimX - 1.5) + "," + (oY + 4) + " " + (dimX + 1.5) + "," + (oY + 4)} fill="#444" />
                    <polygon points={dimX + "," + (oY + shH) + " " + (dimX - 1.5) + "," + (oY + shH - 4) + " " + (dimX + 1.5) + "," + (oY + shH - 4)} fill="#444" />
                    <text x={dimX + 5} y={oY + shH / 2} textAnchor="start" fontSize={geo.fsD} fontWeight="600" fill="#333" fontFamily="'Courier New',monospace" dominantBaseline="middle" transform={"rotate(90 " + (dimX + 5) + " " + (oY + shH / 2) + ")"}>Sheet: {lpFmt(dW)}"</text>
                  </g>

                  {/* Left: Segmented Piece Row Heights Chain */}
                  {pieceRowHeights.length > 0 && (
                    <g className="lp-dim-chain-rows">
                      {(() => {
                        var dimLeftX = Math.max(10, startOriginX - 18);
                        var cumY = startOriginY;
                        return pieceRowHeights.map(function(rowHItem, rIdx) {
                          var rY1 = cumY;
                          var rH = rowHItem.inches * sc;
                          var rY2 = rY1 + rH;
                          cumY += rH;
                          var midY = (rY1 + rY2) / 2;
                          var dimColor = rowHItem.isOffcut ? "#d97706" : "#2563eb";

                          return (
                            <g key={"dim-row-" + rIdx}>
                              {/* Extension line from piece edge to dimension line */}
                              <line x1={startOriginX - 2} y1={rY1} x2={dimLeftX - 3} y2={rY1} stroke="#94a3b8" strokeWidth={0.7} strokeDasharray="2,2" />
                              {rIdx === pieceRowHeights.length - 1 && (
                                <line x1={startOriginX - 2} y1={rY2} x2={dimLeftX - 3} y2={rY2} stroke="#94a3b8" strokeWidth={0.7} strokeDasharray="2,2" />
                              )}
                              {/* Dimension segment */}
                              <line x1={dimLeftX} y1={rY1} x2={dimLeftX} y2={rY2} stroke={dimColor} strokeWidth={1.2} />
                              {/* Tick marks */}
                              <line x1={dimLeftX - 3} y1={rY1 + 3} x2={dimLeftX + 3} y2={rY1 - 3} stroke={dimColor} strokeWidth={1.2} />
                              <line x1={dimLeftX - 3} y1={rY2 + 3} x2={dimLeftX + 3} y2={rY2 - 3} stroke={dimColor} strokeWidth={1.2} />
                              {/* Dimension text */}
                              <text x={dimLeftX - 6} y={rowHItem.isOffcut ? midY - 5 : midY} textAnchor="end" dominantBaseline="central" fontSize={Math.max(8, Math.min(11, sc * 0.52))} fontWeight="700" fill={dimColor} fontFamily="'Courier New',monospace">
                                {lpFmt(rowHItem.inches)}"
                              </text>
                              {rowHItem.isOffcut && (
                                <text x={dimLeftX - 6} y={midY + 7} textAnchor="end" dominantBaseline="central" fontSize={Math.max(6.5, Math.min(8.5, sc * 0.4))} fontWeight="700" fill="#b45309" fontFamily="sans-serif">
                                  ✂️ Offcut
                                </text>
                              )}
                            </g>
                          );
                        });
                      })()}
                    </g>
                  )}

                  {/* Bottom: Segmented Piece Column Widths Chain */}
                  {pieceColWidths.length > 0 && (
                    <g className="lp-dim-chain-cols">
                      {(() => {
                        var dimBtmY = oY + shH + 16;
                        var cumX = startOriginX;
                        return pieceColWidths.map(function(colWItem, cIdx) {
                          var cX1 = cumX;
                          var cW = colWItem.inches * sc;
                          var cX2 = cX1 + cW;
                          cumX += cW;
                          var midX = (cX1 + cX2) / 2;
                          var dimColor = colWItem.isOffcut ? "#d97706" : "#2563eb";

                          return (
                            <g key={"dim-col-" + cIdx}>
                              {/* Extension line down to dimension line */}
                              <line x1={cX1} y1={oY + shH + 2} x2={cX1} y2={dimBtmY + 4} stroke="#94a3b8" strokeWidth={0.7} strokeDasharray="2,2" />
                              {cIdx === pieceColWidths.length - 1 && (
                                <line x1={cX2} y1={oY + shH + 2} x2={cX2} y2={dimBtmY + 4} stroke="#94a3b8" strokeWidth={0.7} strokeDasharray="2,2" />
                              )}
                              {/* Dimension segment */}
                              <line x1={cX1} y1={dimBtmY} x2={cX2} y2={dimBtmY} stroke={dimColor} strokeWidth={1.2} />
                              {/* Tick marks */}
                              <line x1={cX1 - 3} y1={dimBtmY + 3} x2={cX1 + 3} y2={dimBtmY - 3} stroke={dimColor} strokeWidth={1.2} />
                              <line x1={cX2 - 3} y1={dimBtmY + 3} x2={cX2 + 3} y2={dimBtmY - 3} stroke={dimColor} strokeWidth={1.2} />
                              {/* Dimension text */}
                              <text x={midX} y={colWItem.isOffcut ? dimBtmY + 8 : dimBtmY + 12} textAnchor="middle" dominantBaseline="hanging" fontSize={Math.max(8, Math.min(11, sc * 0.52))} fontWeight="700" fill={dimColor} fontFamily="'Courier New',monospace">
                                {lpFmt(colWItem.inches)}"
                              </text>
                              {colWItem.isOffcut && (
                                <text x={midX} y={dimBtmY + 20} textAnchor="middle" dominantBaseline="hanging" fontSize={Math.max(6.5, Math.min(8.5, sc * 0.4))} fontWeight="700" fill="#b45309" fontFamily="sans-serif">
                                  ✂️ Offcut
                                </text>
                              )}
                            </g>
                          );
                        });
                      })()}
                    </g>
                  )}
                </>
              )}

            </svg>
            </div>

            {/* Floating Zoom HUD in Viewport */}
            <div className="lp-zoom-hud" style={{
              position: "sticky",
              bottom: 12,
              right: 12,
              marginLeft: "auto",
              width: "fit-content",
              zIndex: 30,
              display: "flex",
              alignItems: "center",
              gap: 3,
              background: "rgba(15, 23, 42, 0.9)",
              backdropFilter: "blur(6px)",
              padding: "4px 8px",
              borderRadius: 6,
              border: "1px solid rgba(255, 255, 255, 0.2)",
              boxShadow: "0 6px 16px rgba(0,0,0,0.6)"
            }}>
              <button
                type="button"
                onClick={handleZoomOut}
                disabled={zoom <= 0.5}
                style={{
                  background: "none", border: "none",
                  color: zoom <= 0.5 ? "#475569" : "#e2e8f0",
                  cursor: zoom <= 0.5 ? "default" : "pointer",
                  padding: "2px 7px", fontSize: 13, fontWeight: 700, borderRadius: 3,
                  display: "flex", alignItems: "center", justifyContent: "center"
                }}
                title="Zoom Out (-25%)"
              >
                <Minus size={13} />
              </button>
              <button
                type="button"
                onClick={handleZoomReset}
                style={{
                  background: "rgba(56, 189, 248, 0.15)",
                  border: "1px solid rgba(56, 189, 248, 0.35)",
                  borderRadius: 4, color: "#38bdf8",
                  cursor: "pointer", padding: "2px 8px",
                  fontSize: 12, fontFamily: "'Courier New', monospace",
                  fontWeight: 700, minWidth: 48, textAlign: "center"
                }}
                title="Click to Reset Zoom (100%)"
              >
                {Math.round(zoom * 100)}%
              </button>
              <button
                type="button"
                onClick={handleZoomIn}
                disabled={zoom >= 3}
                style={{
                  background: "none", border: "none",
                  color: zoom >= 3 ? "#475569" : "#e2e8f0",
                  cursor: zoom >= 3 ? "default" : "pointer",
                  padding: "2px 7px", fontSize: 13, fontWeight: 700, borderRadius: 3,
                  display: "flex", alignItems: "center", justifyContent: "center"
                }}
                title="Zoom In (+25%)"
              >
                <Plus size={13} />

<script type="text/babel" data-presets="react">
var CONFIG_KEY = "tag-costing-config";
var AGENTS_KEY = "tag-costing-agents";
var USERS_KEY = "tag-costing-users";
var SHEETS_KEY = "tag-costing-sheets";
var HISTORY_KEY = "tag-costing-history";

var API_URL = "https://script.google.com/macros/s/AKfycbyQhMT5jnm0SgiCVD_PMpgX48N_owZGqMX7cW_9M__npBDCVDjwuT5e1WhlYgj_pfFd/exec";

function jsonpRequest(params) {
  return new Promise(function(resolve, reject) {
    if (!API_URL || API_URL.indexOf("PASTE_YOUR") === 0) {
      reject(new Error("API_URL not configured yet"));
      return;
    }
    var cbName = "tcCb_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    var script = null;
    var timeout = null;
    function cleanup() {
      delete window[cbName];
      if (script && script.parentNode) script.parentNode.removeChild(script);
      clearTimeout(timeout);
    }
    timeout = setTimeout(function() { cleanup(); reject(new Error("Request timed out")); }, 15000);
    window[cbName] = function(data) { cleanup(); resolve(data); };
    var query = new URLSearchParams(Object.assign({}, params, { callback: cbName })).toString();
    script = document.createElement("script");
    script.src = API_URL + "?" + query;
    script.onerror = function() { cleanup(); reject(new Error("Network error reaching API")); };
    document.body.appendChild(script);
  });
}

var __tcCache = null;
var __tcCacheAt = 0;
async function fetchAllCached() {
  var now = Date.now();
  if (__tcCache && now - __tcCacheAt < 2000) return __tcCache;
  var result = await jsonpRequest({ action: "getAll" });
  if (!result.ok) throw new Error(result.error || "Failed to load data");
  __tcCache = result;
  __tcCacheAt = now;
  return result;
}

var KEY_TO_SAVE_ACTION = {};
KEY_TO_SAVE_ACTION[CONFIG_KEY] = "saveConfig";
KEY_TO_SAVE_ACTION[AGENTS_KEY] = "saveAgents";
KEY_TO_SAVE_ACTION[SHEETS_KEY] = "saveSheets";
KEY_TO_SAVE_ACTION[USERS_KEY] = "saveUsers";
var KEY_TO_RESULT_FIELD = {};
KEY_TO_RESULT_FIELD[CONFIG_KEY] = "config";
KEY_TO_RESULT_FIELD[AGENTS_KEY] = "agents";
KEY_TO_RESULT_FIELD[SHEETS_KEY] = "sheets";
KEY_TO_RESULT_FIELD[USERS_KEY] = "users";

window.storage = {
  get: async function(key) {
    var result = await fetchAllCached();
    var field = KEY_TO_RESULT_FIELD[key];
    if (!field) return null;
    return { key: key, value: JSON.stringify(result[field]), shared: true };
  },
  set: async function(key, value, shared, pin) {
    var action = KEY_TO_SAVE_ACTION[key];
    if (!action) return null;
    var result = await jsonpRequest({ action: action, payload: value, pin: pin || "" });
    if (!result.ok) throw new Error(result.error || "Save failed");
    __tcCache = null;
    return { key: key, value: value, shared: shared };
  },
};

  function renderTicketCanvas() {

      var ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);

      ctx.fillStyle = "#f6f1e7";

      var pad = 20;

      ctx.shadowOffsetY = 4;

      } else {
        ctx.rect(cardX, cardY, cardW, cardH);
      }
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = "#e2d7c5";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = "#cfc2ad";
      ctx.lineWidth = 1;

      ctx.fillStyle = "#d5c8b2";
      ctx.fill();
      ctx.strokeStyle = "#9e8e78";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cardY + 36, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#faf6ed";
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx, cardY + 25);
      ctx.quadraticCurveTo(cx - 16, cardY - 8, cx, cardY - 20);

      ctx.strokeStyle = "#a3937c";
      ctx.lineWidth = 2;

      ctx.textAlign = "center";

      ctx.beginPath();

      ctx.strokeStyle = "#e0d5c3";

      var sheetName = selectedSheet ? selectedSheet.number : (sheetL + '" × ' + sheetW + '"');

      var specs = [

        ctx.lineWidth = 1;
        ctx.stroke();
