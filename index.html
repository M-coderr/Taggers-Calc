                    <Field label="Emboss width"><NumberInput value={embossW} onChange={setEmbossW} suffix="in" /></Field>
                  </div>
                  {isOwner && <div className="tc-field-hint">Emboss: Rs0.25/tag (≤2x3", Rs500 block), Rs0.30/tag (>2x3", Rs1,000 block)</div>}
                </div>
              )}
              <div className="tc-field-hint" style={{ marginBottom: 10, marginTop: 6 }}>Die punching is applied to every job automatically unless Repeat Die is checked.</div>
              <div className="tc-section-title"><Truck /> Order</div>
              <div className="tc-row">
                <Field label="Order quantity"><NumberInput value={orderQty} onChange={setOrderQty} min={1} step={1} suffix="tags" /></Field>
                {isOwner ? <Field label="Transport (flat)"><NumberInput value={transport} onChange={setTransport} suffix="Rs/order" /></Field> : <div />}
              </div>
              {isOwner && (<>
                <div className="tc-section-title"><Percent /> Your reference margin</div>
                <div className="tc-margin-row" style={{ marginTop: 0 }}>
                  <div style={{ width: 110 }}><NumberInput value={marginPct} onChange={setMarginPct} min={0} suffix="%" /></div>
                  <div className="tc-choice-row" style={{ marginBottom: 0, flex: 1 }}>
                    <div className={"tc-choice" + (marginMode === "markup" ? " tc-choice-active" : "")} onClick={function() { setMarginMode("markup"); }}>On cost (markup)</div>
                    <div className={"tc-choice" + (marginMode === "margin" ? " tc-choice-active" : "")} onClick={function() { setMarginMode("margin"); }}>On price (margin)</div>
                  </div>
                </div>
              </>)}
              <button
                type="button"
                className="tc-calc-btn"
                onClick={handleCalculateQuote}
                disabled={hasCalculated}
              >
                {hasCalculated ? <Check size={16} /> : <Calculator size={16} />}
                {hasCalculated ? "Quote Calculated" : "Calculate Quote"}
              </button>
            </>) : null}
          </div>
          {activeView === "calculator" && (
            !hasCalculated ? (
              <div className="tc-tag" style={{ display: "flex", justifyContent: "center", alignItems: "center", padding: "40px 20px", textAlign: "center", color: "#666" }}>
                <div>{!selectedSheet && !isOwner ? "Select a sheet number and click 'Calculate Quote'." : "Click 'Calculate Quote' to generate price ticket."}</div>
              </div>
            ) : !calc ? (
              <div className="tc-tag" style={{ display: "flex", justifyContent: "center", alignItems: "center", padding: "40px 20px", textAlign: "center", color: "#666" }}>
                <div>No valid layouts found. The resulting pieces might be smaller than the machine's required minimum feed size. Adjust dimensions.</div>
              </div>
            ) : (
              <div>
                {isOwner ? (
                  <div className="tc-tag">
                    <div className="tc-tag-hole-loop" />
                    <div className="tc-tag-header"><div className="tc-tag-eyebrow">Cost Breakdown</div><div className="tc-tag-qty">{num(orderQty, 0)} tags ordered - {num(calc.sheetsNeeded, 0)} sheets - {num(calc.totalPieces, 0)} pieces - {num(calc.totalTags, 0)} tags produced</div></div>
                    <div className="tc-lines">
                      <LineItem icon={<Layers />} label="Material" sub={num(calc.sheetsNeeded, 0) + " sheets x " + inr(sheetRate)} amount={inr(calc.materialCost)} />
                      <LineItem icon={<Printer />} label={printMethod === "offset" ? "Offset printing" : "Screen printing"} sub={printMethod === "offset" ? "Min Rs2,000 (1000 pcs) + " + Math.max(0, calc.printSlabs - 1) + " x Rs350" : colors + " color(s) x Rs500 x " + calc.printSlabs + " slab(s)"} amount={inr(calc.printingCost)} />
                      <LineItem icon={<CircleDot />} label="Lamination (matt)" sub={lamination ? num(calc.pieceAreaSqIn) + " sq.in x " + num(calc.totalPieces, 0) + " pieces x Rs0.004" : "Not applied"} amount={inr(calc.laminationCost)} muted={!lamination} />
                      <LineItem icon={<Scissors />} label="Die punching" sub={"Die (" + calc.tier.label + "): " + inr(calc.dieMakingCost) + " + running " + calc.dieSlabs + " slab(s) x Rs" + calc.tier.runRate} amount={inr(calc.dieTotalCost)} />
                      <LineItem icon={<Sparkles />} label="Foil stamping" sub={foil ? ("Area (" + num(calc.foilL) + '"x' + num(calc.foilW) + '" = ' + num(calc.foilArea) + " sq.in): " + inr(calc.foilBlockCost) + " block + " + num(calc.orderQty, 0) + " tags x " + inr(calc.foilPieceRate) + "/tag") : "Not applied"} amount={inr(calc.foilCost)} muted={!foil} />
                      <LineItem icon={<CircleDot />} label="Embossing" sub={emboss ? ("Area (" + num(calc.embossL) + '"x' + num(calc.embossW) + '" = ' + num(calc.embossArea) + " sq.in): " + inr(calc.embossBlockCost) + " block + " + num(calc.orderQty, 0) + " tags x " + inr(calc.embossPieceRate) + "/tag") : "Not applied"} amount={inr(calc.embossCost)} muted={!emboss} />
                      <LineItem icon={<Truck />} label="Transportation" sub="Flat, per order" amount={inr(calc.transportCost)} />
                    </div>
                    <div className="tc-subtotal-row"><span>Subtotal (cost)</span><strong>{inr(calc.subtotal)}</strong></div>
                    <div className="tc-subtotal-row"><span>Profit ({marginPct}% {marginMode === "markup" ? "on cost" : "on price"})</span><strong>{inr(calc.profitAmount)}</strong></div>
                    <div style={{ background: "rgba(0,0,0,0.03)", padding: 14, borderRadius: 8, marginTop: 12, marginBottom: 12, border: "1px solid rgba(0,0,0,0.08)" }}>
                      <div style={{ fontWeight: 600, fontSize: 13, textTransform: "uppercase", letterSpacing: "0.5px", marginBottom: 10, color: "var(--stamp)" }}>Owner 3-Tier Cost Summary</div>
                      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                        <div style={{ background: "#fff", padding: "10px 12px", borderRadius: 6, border: "1px solid #ddd" }}>
                          <div style={{ fontSize: 11, color: "#666", textTransform: "uppercase", fontWeight: 600 }}>1. Actual Costing</div>
                          <div style={{ fontSize: 17, fontWeight: 700, color: "#333", marginTop: 4 }}>{inr(calc.rawCostPerTag)} <small style={{ fontSize: 11, fontWeight: 400 }}>/ tag</small></div>
                          <div style={{ fontSize: 11, color: "#777", marginTop: 2 }}>Total: {inr(calc.rawSubtotal)}</div>
                        </div>
                        <div style={{ background: "#fff", padding: "10px 12px", borderRadius: 6, border: "1px solid #ddd" }}>
                          <div style={{ fontSize: 11, color: "#2e7d32", textTransform: "uppercase", fontWeight: 600 }}>2. + Margin ({marginPct}%)</div>
                          <div style={{ fontSize: 17, fontWeight: 700, color: "#2e7d32", marginTop: 4 }}>{inr(calc.exactPricePerTag)} <small style={{ fontSize: 11, fontWeight: 400 }}>/ tag</small></div>
                          <div style={{ fontSize: 11, color: "#555", marginTop: 2 }}>Total: {inr(calc.exactSellingPrice)}</div>
                        </div>
                        <div style={{ background: "#e8f5e9", padding: "10px 12px", borderRadius: 6, border: "1px solid #a5d6a7" }}>
                          <div style={{ fontSize: 11, color: "#1b5e20", textTransform: "uppercase", fontWeight: 600 }}>3. Agent Selling Rate</div>
                          <div style={{ fontSize: 17, fontWeight: 700, color: "#1b5e20", marginTop: 4 }}>{inr(calc.pricePerTag)} <small style={{ fontSize: 11, fontWeight: 400 }}>/ tag</small></div>
                          <div style={{ fontSize: 11, color: "#2e7d32", marginTop: 2 }}>Total: {inr(calc.sellingPrice)}</div>
                        </div>
                      </div>
                      {calc.isSlabApplied && (
                        <div className="tc-field-hint" style={{ marginTop: 8, color: "#2980b9", fontWeight: 600 }}>
                          💡 Quantity Slab Rate: {num(orderQty, 0)} tags priced at the {num(calc.slabQty, 0)} tag run rate (shown to Agent).
                        </div>
                      )}
                    </div>
                    {calc.overage > 0 && <div className="tc-overage-note">Sheets round up to whole numbers - this run produces {num(calc.totalTags, 0)} tags, {num(calc.overage, 0)} more than ordered, at no extra charge.</div>}
                    <button className={"tc-assump-toggle" + (showAssumptions ? " open" : "")} onClick={function() { setShowAssumptions(function(s) { return !s; }); }}><ChevronDown /> {showAssumptions ? "Hide" : "Show"} assumptions used in this calculation</button>
                    {showAssumptions && (<ul className="tc-assumptions">
                      <li>The full sheet is cut into {num(calc.n,0)} x {num(calc.m,0)} = {num(calc.autoPiecesPerSheet,0)} equal pieces ({num(calc.pieceL)}" x {num(calc.pieceW)}" each) sized to fit the {printMethod} machine's max feed.</li>
                      <li>Each piece is then packed with tags (each needing {num(cuttingOverlapMM,1)}mm cutting overlap per side): {num(calc.tagsRows,0)} x {num(calc.tagsCols,0)} = {num(calc.tagsPerPieceNominal,0)} tags/piece, {num(calc.totalTagsPerSheet,0)} tags/sheet total.</li>
                      <li>The leftover space becomes the inlap/margin around the tags - at least the minimum {num(insideMarginMM,1)}mm/side you set.</li>
                      <li>Printing, lamination and die-punching costs are counted per piece, not per tag or per sheet.</li>
                      <li>Slab rounding: up to 200 pieces over a 1,000 mark still count as that slab; 201+ rolls to the next.</li>
                      <li>Lamination area is based on the piece size, at Rs0.004/sq.in, matt only.</li>
                      <li>Die tier and running rate: up to 10x10" (Rs1,000 die), up to 14x20" (Rs1,800 die), both Rs500/1000 running; bigger is Rs2,800 die at Rs750/1000 running.</li>
                      {foil && <li>Foil stamping: Rs250 block charge + Rs{calc.foilPieceRate.toFixed(2)}/tag for {num(calc.foilArea)} sq.in.</li>}
                      {emboss && <li>Embossing: Rs{calc.embossBlockCost} block charge + Rs{calc.embossPieceRate.toFixed(2)}/tag for {num(calc.embossArea)} sq.in.</li>}
                      {calc.isSlabApplied && <li>Quantity slab rate tiering applied: {num(orderQty, 0)} tags evaluated at {num(calc.slabQty, 0)} run rate.</li>}
                      <li>Labor is Rs0 - treated as already built into the rates above.</li>
                      <li>Transport is a flat Rs{num(transport, 0)} per order, not per piece.</li>
                      <li>Agent margins are stored per user and applied automatically - agents never see the cost breakdown or the %.</li>
                    </ul>)}
                    <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                      <button
                        type="button"
                        onClick={handleDownloadTicketPng}
                        style={{
                          flex: 1,
                          background: "#4a3b30",
                          color: "#ffffff",
                          border: "none",
                          borderRadius: 8,
                          padding: "12px 14px",
                          fontWeight: 700,
                          fontSize: 13,
                          cursor: "pointer",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          gap: 6
                        }}
                      >
                        <ImageIcon size={16} /> Download PNG
                      </button>
                      <button
                        type="button"
                        onClick={handleShareWhatsAppImage}
                        style={{
                          flex: 1,
                          background: "#25D366",
                          color: "#ffffff",
                          border: "none",
                          borderRadius: 8,
                          padding: "12px 14px",
                          fontWeight: 700,
                          fontSize: 13,
                          cursor: "pointer",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          gap: 6,
                          boxShadow: "0 2px 6px rgba(37,211,102,0.3)"
                        }}
                      >
                        <Share2 size={16} /> Share on WhatsApp
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="tc-tag">
                    <div className="tc-tag-hole-loop" />
                    <div className="tc-tag-header"><div className="tc-tag-eyebrow">Quote</div><div className="tc-tag-qty">{num(orderQty, 0)} tags</div></div>
                    {(calc.foil || calc.emboss) && (
                      <div className="tc-lines" style={{ marginTop: 12, marginBottom: 12, borderBottom: "1px dashed #d0d0d0", paddingBottom: 10 }}>
                        <LineItem icon={<Scissors />} label="Tag (Printing & Punching)" sub={"Total: " + inr(calc.tagSellingPrice)} amount={inr(calc.tagSellingPrice / orderQty) + " / tag"} />
                        {calc.foil && <LineItem icon={<Sparkles />} label={"Foil Stamping (" + num(calc.foilL) + '"x' + num(calc.foilW) + '")'} sub={"Total: " + inr(calc.foilSellingPrice)} amount={inr(calc.foilSellingPrice / orderQty) + " / tag"} />}
                        {calc.emboss && <LineItem icon={<CircleDot />} label={"Embossing (" + num(calc.embossL) + '"x' + num(calc.embossW) + '")'} sub={"Total: " + inr(calc.embossSellingPrice)} amount={inr(calc.embossSellingPrice / orderQty) + " / tag"} />}
                      </div>
                    )}
                    <div className="tc-final" style={{ marginTop: 6 }}>
                      <div className="tc-final-label">Price Per Tag</div>
                      <div className="tc-final-price">{inr(calc.pricePerTag)} <span style={{ fontSize: 16, fontWeight: 400, opacity: 0.85 }}>/ tag</span></div>
                      <div className="tc-final-per">Total order price ({num(orderQty, 0)} tags): {inr(calc.sellingPrice)}</div>
                    </div>
                    <div style={{ display: "flex", gap: 10, marginTop: 14 }}>
                      <button
                        type="button"
                        onClick={handleDownloadTicketPng}
                        style={{
                          flex: 1,
                          background: "#4a3b30",
                          color: "#ffffff",
                          border: "none",
                          borderRadius: 8,
                          padding: "12px 14px",
                          fontWeight: 700,
                          fontSize: 13,
                          cursor: "pointer",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          gap: 6
                        }}
                      >
                        <ImageIcon size={16} /> Download PNG
                      </button>
                      <button
                        type="button"
                        onClick={handleShareWhatsAppImage}
                        style={{
                          flex: 1,
                          background: "#25D366",
                          color: "#ffffff",
                          border: "none",
                          borderRadius: 8,
                          padding: "12px 14px",
                          fontWeight: 700,
                          fontSize: 13,
                          cursor: "pointer",
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          gap: 6,
                          boxShadow: "0 2px 6px rgba(37,211,102,0.3)"
                        }}
                      >
                        <Share2 size={16} /> Share on WhatsApp
                      </button>
                    </div>
                  </div>
                )}
              </div>
            )
          )}
        </div>
        {isOwner && activeView === "calculator" && hasCalculated && calc && (
          <div style={{ maxWidth: 1180, margin: "18px auto 0" }}>
            <button className={"tc-assump-toggle" + (showLayoutPreview ? " open" : "")} onClick={function() { setShowLayoutPreview(function(s) { return !s; }); }}><ChevronDown /> {showLayoutPreview ? "Hide" : "Show"} visual layout preview</button>
            {showLayoutPreview && <div style={{ marginTop: 12 }}>
              {layoutCandidates && layoutCandidates.length > 1 && (
                <div className="lo-alt-bar">
                  {layoutCandidates.slice(0, 6).map(function(c, i) {
                    return (
                      <button key={i} className={"lo-alt-btn" + (safeAltIdx === i ? " lo-alt-active" : "") + (i === 0 ? " lo-alt-best" : "")}
                        onClick={function() { handleSelectAltCandidate(i); }}>
                        <span className="lo-alt-label">{i === 0 ? "BEST" : "Alt " + i}</span>
                        <span className="lo-alt-stat" style={{ color: "#2e7d32", fontWeight: 600 }}>{c.production ? Math.round(c.production.productionScore) : 0} <small>Score</small></span>
                        <span className="lo-alt-stat">{num(c.totalTagsPerSheet, 0)} <small>tags/sht</small></span>
                        <span className="lo-alt-stat">{c.wastePct.toFixed(1)}% <small>waste</small></span>
                        <span className="lo-alt-stat">{c.production ? c.production.guillotineCuts : '?'} <small>cuts</small></span>
                        <span className="lo-alt-reason">{c.reasons.join(', ')}</span>
                      </button>
                    );
                  })}
                </div>
              )}
              {Array.isArray(layoutCandidates) && layoutCandidates.length === 0 ? (
                <div className="lo-no-layout">No manufacturable layout found for current machine.</div>
              ) : (
              <div style={{ marginTop: layoutCandidates && layoutCandidates.length > 1 ? 12 : 0 }}>
                {suggestedLayout && (
                  <div className="suggestion-banner" style={{ background: "#e3f2fd", border: "1px solid #bbdefb", padding: "12px 16px", borderRadius: 6, marginBottom: 16, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div style={{ color: "#0d47a1", fontSize: 14 }}>
                      <strong>💡 Pro Tip: Reduce Waste!</strong><br />
                      Changing your tag size slightly to <strong>{suggestedLayout.tagL.toFixed(3)} × {suggestedLayout.tagW.toFixed(3)}"</strong> (-{suggestedLayout.dec.toFixed(3)}") will fit <strong>{suggestedLayout.tagsPerSheet} tags</strong> per sheet (up from {selectedC ? selectedC.totalTagsPerSheet : 0}), dropping waste to <strong>{suggestedLayout.wastePct.toFixed(1)}%</strong>.
                    </div>
                    <button style={{ background: "#1976d2", color: "white", border: "none", padding: "8px 16px", borderRadius: 4, cursor: "pointer", fontWeight: 600 }} onClick={function() {
                      setTagL(suggestedLayout.tagL);
                      setTagW(suggestedLayout.tagW);
                    }}>Apply Suggestion</button>
                  </div>
                )}
                <MemoLayoutPreview title="Layout Preview"
                  selectedC={selectedC}
                  sheetLength={sheetL} sheetWidth={sheetW}
                  pieceLength={selectedC ? selectedC.pieceL : calc.pieceL}
                  pieceWidth={selectedC ? selectedC.pieceW : calc.pieceW}
                  piecesAcross={selectedC ? selectedC.n : calc.n}
                  piecesDown={selectedC ? selectedC.m : calc.m}
                  tagLength={selectedC ? selectedC.TL : calc.TL}
                  tagWidth={selectedC ? selectedC.TW : calc.TW}
                  tagsAcross={selectedC ? selectedC.tagsRows : calc.tagsRows}
                  tagsDown={selectedC ? selectedC.tagsCols : calc.tagsCols}
                  renderTagsAcross={selectedC && selectedC.optimization ? selectedC.optimization.renderCols : calc.tagsCols}
                  renderTagsDown={selectedC && selectedC.optimization ? selectedC.optimization.renderRows : calc.tagsRows}
                  optimizedTagsPerPiece={selectedC && selectedC.optimization ? selectedC.optimization.finalTags : calc.tagsRows * calc.tagsCols}
                  rotAdditions={selectedC && selectedC.optimization ? selectedC.optimization.rotAdditions : 0}
                  rotColCount={selectedC && selectedC.optimization ? selectedC.optimization.rotColCount : 0}
                  rotRowCount={selectedC && selectedC.optimization ? selectedC.optimization.rotRowCount : 0}
                  cornerCount={selectedC && selectedC.optimization ? (selectedC.optimization.cornerCount || 0) : 0}
                  cornerTagL={selectedC && selectedC.optimization ? (selectedC.optimization.cornerTagL || 0) : 0}
                  cornerTagW={selectedC && selectedC.optimization ? (selectedC.optimization.cornerTagW || 0) : 0}
                  reclaimStrategy={selectedC && selectedC.optimization ? selectedC.optimization.reclaimStrategy : 'strip'}
                  overlap={calc.overlapIn} margin={calc.marginIn}
                  tagRotated={selectedC && selectedC.optimization ? selectedC.optimization.isTagRotated : false}
                  orientation={calc.isRotated ? "Tag rotated 90deg" : "Tag as entered"}
                  totalSheets={calc.sheetsNeeded} quantity={orderQty}
                  feedDirection={printMethod === "offset" ? "Offset press feed" : "Screen-print feed"} />
                {selectedC && selectedC.production && (
                  <div className="production-panel" style={{ marginTop: 12, padding: 12, background: "#f8f9fa", border: "1px solid #ddd", fontSize: 13, borderRadius: 4 }}>
                    <div style={{ fontWeight: 600, marginBottom: 8 }}>Production Analysis (Score: {Math.round(selectedC.production.productionScore)})</div>
                    <div style={{ display: "flex", gap: 20 }}>
                      <div>
                        <strong>Piece Types ({selectedC.production.uniquePieceTypes}):</strong>
                        <ul style={{ margin: "4px 0", paddingLeft: 20 }}>
                          {selectedC.production.pieceTypes.map(function(pt, i) {
                            return <li key={i}>{pt.count} × {pt.label} ({pt.sizeDesc}) — {pt.tagsPerPiece} tags</li>;
                          })}
                        </ul>
                      </div>
                      <div>
                        <strong>Production Stats:</strong>
                        <ul style={{ margin: "4px 0", paddingLeft: 20 }}>
                          <li>Guillotine Cuts: {selectedC.production.guillotineCuts}</li>
                          <li>Handling: {selectedC.production.handlingLabel}</li>
                          <li>Paper Utilization: {selectedC.utilization.toFixed(1)}%</li>
                        </ul>
                      </div>
                      <div>
                        <strong>Why Selected:</strong>
                        <ul style={{ margin: "4px 0", paddingLeft: 20, color: "#2e7d32" }}>
                          {selectedC.production.whySelected.map(function(reason, i) {
                            return <li key={i}>✔ {reason}</li>;
                          })}
                        </ul>
                      </div>
                    </div>
                  </div>
                )}
              </div>
              )}
            </div>
            }
          </div>
        )}
        {showTicketModal && (
          <div style={{ position: "fixed", top: 0, left: 0, right: 0, bottom: 0, background: "rgba(0,0,0,0.65)", display: "flex", justifyContent: "center", alignItems: "center", zIndex: 9999, padding: 16 }}>
            <div style={{ background: "#fff", borderRadius: 12, width: "100%", maxWidth: 580, maxHeight: "90vh", display: "flex", flexDirection: "column", overflow: "hidden", boxShadow: "0 20px 40px rgba(0,0,0,0.3)" }}>
              <div style={{ padding: "14px 20px", background: "var(--card-head)", borderBottom: "1px solid var(--line-light)", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div style={{ fontWeight: 700, fontSize: 16, color: "var(--ink)" }}>Order Ticket Card Preview</div>
                <button onClick={function() { setShowTicketModal(false); }} style={{ background: "none", border: "none", cursor: "pointer", color: "var(--ink-soft)" }}><X size={18} /></button>
              </div>
              <div style={{ padding: 20, overflowY: "auto", flex: 1, display: "flex", justifyContent: "center", alignItems: "center", background: "#eae5da" }}>
                {generatingImage ? (
                  <div style={{ padding: 40, textAlign: "center", color: "#666" }}>Generating visual order ticket...</div>
                ) : ticketImage && ticketImage.dataUrl ? (
                  <img src={ticketImage.dataUrl} alt="Order Ticket" style={{ maxWidth: "100%", height: "auto", borderRadius: 10, boxShadow: "0 8px 24px rgba(0,0,0,0.15)" }} />
                ) : (
                  <div style={{ padding: 40, textAlign: "center", color: "#999" }}>Failed to generate image.</div>
                )}
              </div>
              <div style={{ padding: "14px 20px", background: "#fff", borderTop: "1px solid #eee", display: "flex", gap: 10, flexWrap: "wrap", justifyContent: "flex-end" }}>
                <button
                  type="button"
                  onClick={handleDownloadTicketPng}
                  disabled={!ticketImage}
                  style={{ background: "#fff", color: "#333", border: "1px solid #ccc", padding: "9px 15px", borderRadius: 6, cursor: "pointer", fontWeight: 600, fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}
                >
                  <ImageIcon size={14} /> Download PNG
                </button>
                <button
                  type="button"
                  onClick={handleCopyTicketImage}
                  disabled={!ticketImage}
                  style={{ background: copiedImage ? "#e8f5e9" : "#fff", color: copiedImage ? "#2e7d32" : "#333", border: copiedImage ? "1px solid #a5d6a7" : "1px solid #ccc", padding: "9px 15px", borderRadius: 6, cursor: "pointer", fontWeight: 600, fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}
                >
                  {copiedImage ? <Check size={14} color="#2e7d32" /> : <Copy size={14} />} {copiedImage ? "Image Copied!" : "Copy Image"}
                </button>
                <button
                  type="button"
                  onClick={handleShareWhatsApp}
                  style={{ background: "#25D366", color: "#fff", border: "none", padding: "9px 16px", borderRadius: 6, cursor: "pointer", fontWeight: 700, fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}
                >
                  <Share2 size={14} /> Share on WhatsApp
                </button>
              </div>
            </div>
          </div>
        )}
      </>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TagCostingCalculator />);
</script>
</body>
</html>
